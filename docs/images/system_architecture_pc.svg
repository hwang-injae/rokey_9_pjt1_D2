<text x="1152" y="320" font-size="13" font-weight="bold">범례</text>
<text x="1152" y="337" font-size="11" font-weight="normal"></text>
<text x="1152" y="354" font-size="11" font-weight="normal">□ 사각형 = 노드</text>
<text x="1152" y="371" font-size="11" font-weight="normal">◯ 타원 = 토픽</text>
<text x="1152" y="388" font-size="11" font-weight="normal">→ 실선 화살표 = 서비스 호출(요청 방향)</text>
<text x="1152" y="405" font-size="11" font-weight="normal">     라벨 = 서비스 이름 : 타입</text>
<text x="1152" y="422" font-size="11" font-weight="normal">⇢ 점선 화살표 = 토픽 publish / subscribe</text>
<text x="1152" y="439" font-size="11" font-weight="normal">     라벨 = 메시지 타입</text>
<text x="1152" y="456" font-size="11" font-weight="normal">┄ 점선 상자 = 파이썬 패키지·함수(노드 아님)</text>
<text x="1152" y="473" font-size="11" font-weight="normal">→ 회색 가는 화살표 = 파이썬 함수 호출</text>
<text x="1152" y="490" font-size="11" font-weight="normal">━ 굵은 선 = 네트워크·물리 연결</text>
<text x="1152" y="507" font-size="11" font-weight="normal">색: 파랑 F1 · 초록 F2 · 주황 F3 · 보라 F4 · 회색 외부</text>
