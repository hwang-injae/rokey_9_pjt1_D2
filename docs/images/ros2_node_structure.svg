<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1070" width="1680" height="1070" font-family="'Noto Sans KR','Noto Sans CJK KR','IBM Plex Sans KR',sans-serif"><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2c3440"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fde"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d49a1a"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a94a6"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/></marker></defs><rect width="1680" height="1070" fill="#ffffff"/><text x="40" y="44.0" font-size="26" font-weight="800" fill="#1c2430" text-anchor="start">PreWash-Cell · ROS 2 노드 구조 (2026-09-22 기준)</text><text x="40" y="72.0" font-size="15" font-weight="400" fill="#3d4a5c" text-anchor="start">우리가 만든 노드는 2개(flow_node · hmi_bridge). 기능 F1·F2·F3 는 노드가 아니라 flow_node 가 차례로 부르는 파이썬 함수다. ROS 통신은 flow ↔ HMI 와 드라이버뿐.</text><rect x="1270" y="22" width="380" height="76" rx="8" fill="#ffffff" stroke="#c5ccd6" stroke-width="1.2"/><rect x="1284" y="36" width="34" height="20" rx="4" fill="#e8f1ff" stroke="#2f6fde" stroke-width="2"/><text x="1326" y="51.0" font-size="13" font-weight="500" fill="#1c2430" text-anchor="start">노드</text><ellipse cx="1398" cy="46" rx="20" ry="11" fill="#fff4d6" stroke="#d49a1a" stroke-width="2"/><text x="1424" y="51.0" font-size="13" font-weight="500" fill="#1c2430" text-anchor="start">토픽</text><rect x="1478" y="36" width="34" height="20" rx="4" fill="#f6f7f9" stroke="#8a94a6" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1520" y="51.0" font-size="13" font-weight="500" fill="#1c2430" text-anchor="start">패키지(노드 아님)</text><path d="M1284 80 H1320" stroke="#2c3440" stroke-width="2" marker-end="url(#ak)"/><text x="1326" y="85.0" font-size="13" font-weight="500" fill="#1c2430" text-anchor="start">서비스 호출</text><path d="M1412 80 H1448" stroke="#d49a1a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ao)"/><text x="1454" y="85.0" font-size="13" font-weight="500" fill="#1c2430" text-anchor="start">토픽 발행</text><path d="M1532 80 H1568" stroke="#8a94a6" stroke-width="2" marker-end="url(#ag)"/><text x="1574" y="85.0" font-size="13" font-weight="500" fill="#1c2430" text-anchor="start">함수 호출</text><rect x="30" y="118" width="1000" height="910" rx="14" fill="#ffffff" stroke="#2c3440" stroke-width="2.5"/><text x="52" y="150.0" font-size="17" font-weight="800" fill="#1c2430" text-anchor="start">PC-A · 로봇 제어 PC (한석형 PC) — Ubuntu 24.04 · ROS 2 Jazzy · ROS_DOMAIN_ID 60</text><rect x="60" y="172" width="700" height="520" rx="12" fill="#fbfcfe" stroke="#2f6fde" stroke-width="2" stroke-dasharray="10 6"/><text x="80" y="200.0" font-size="15.5" font-weight="700" fill="#2f6fde" text-anchor="start">flow_node 프로세스 1개 — 패키지 f2_sense_flow (메인 프로그램 · 민범진)</text><rect x="90" y="218" width="320" height="96" rx="8" fill="#e8f1ff" stroke="#2f6fde" stroke-width="2.5"/><text x="250.0" y="248.0" font-size="18" font-weight="700" fill="#1c2430" text-anchor="middle">flow_node_dsr</text><text x="250.0" y="272.0" font-size="13.5" font-weight="400" fill="#3d4a5c" text-anchor="middle">두산 API 전용 보조 노드 (cc.init 이 만든다)</text><text x="250" y="300.0" font-size="12" font-weight="400" fill="#3d4a5c" text-anchor="middle">cobot_common 이 두산 API 를 이 노드로 부른다</text><rect x="430" y="218" width="310" height="96" rx="8" fill="#e8f1ff" stroke="#2f6fde" stroke-width="2.5"/><text x="585.0" y="248.0" font-size="18" font-weight="700" fill="#1c2430" text-anchor="middle">flow_node (통신 노드)</text><text x="585.0" y="272.0" font-size="13.5" font-weight="400" fill="#3d4a5c" text-anchor="middle">서비스 4 · 발행 2 · 상태 2 Hz 타이머</text><text x="585" y="300.0" font-size="12" font-weight="400" fill="#b3261e" text-anchor="middle">콜백은 값 저장·깃발 세우기만(로봇 명령 금지)</text><rect x="90" y="336" width="650" height="58" rx="8" fill="#eef7ee" stroke="#3f8f4f" stroke-width="2"/><text x="415" y="360.0" font-size="16" font-weight="700" fill="#1f5e2c" text-anchor="middle">메인 스레드 — 공정 순서 실행 (flow.py 상태 머신)</text><text x="415" y="382.0" font-size="12.5" font-weight="400" fill="#1f5e2c" text-anchor="middle">집기 → 무게 → 털기 → 안착 → 세제 → 닦기 → 헹굼 → 적재 · 로봇 함수는 여기서만 부른다(SDD §3.2)</text><rect x="90" y="416" width="205" height="92" rx="8" fill="#f6f7f9" stroke="#8a94a6" stroke-width="1.8" stroke-dasharray="7 5"/><text x="192.5" y="442.0" font-size="15.5" font-weight="700" fill="#2c3440" text-anchor="middle">f1_handling</text><text x="192.5" y="464.0" font-size="13" font-weight="400" fill="#56657a" text-anchor="middle">pick · place · move_to</text><text x="192" y="486.0" font-size="12.5" font-weight="400" fill="#56657a" text-anchor="middle">tool · rack_place (한석형 · 황인재)</text><rect x="312" y="416" width="205" height="92" rx="8" fill="#f6f7f9" stroke="#8a94a6" stroke-width="1.8" stroke-dasharray="7 5"/><text x="414.5" y="442.0" font-size="15.5" font-weight="700" fill="#2c3440" text-anchor="middle">f2_sense_flow.sense</text><text x="414.5" y="464.0" font-size="13" font-weight="400" fill="#56657a" text-anchor="middle">weigh · leftover_loop</text><text x="414" y="486.0" font-size="12.5" font-weight="400" fill="#56657a" text-anchor="middle">shake · dip (민범진)</text><rect x="534" y="416" width="206" height="92" rx="8" fill="#f6f7f9" stroke="#8a94a6" stroke-width="1.8" stroke-dasharray="7 5"/><text x="637.0" y="442.0" font-size="15.5" font-weight="700" fill="#2c3440" text-anchor="middle">f3_wipe</text><text x="637.0" y="464.0" font-size="13" font-weight="400" fill="#56657a" text-anchor="middle">soap · wipe_bowl</text><text x="637" y="486.0" font-size="12.5" font-weight="400" fill="#56657a" text-anchor="middle">wipe_cup (박진용)</text><path d="M192 394 L192 414" fill="none" stroke="#8a94a6" stroke-width="2" marker-end="url(#ag)"/><path d="M414 394 L414 414" fill="none" stroke="#8a94a6" stroke-width="2" marker-end="url(#ag)"/><path d="M637 394 L637 414" fill="none" stroke="#8a94a6" stroke-width="2" marker-end="url(#ag)"/><rect x="90" y="530" width="650" height="70" rx="8" fill="#f6f7f9" stroke="#8a94a6" stroke-width="1.8" stroke-dasharray="7 5"/><text x="415.0" y="556.0" font-size="15.5" font-weight="700" fill="#2c3440" text-anchor="middle">cobot_common (공용 로봇 함수 · 4명 분담) + cobot_api (함수 약속)</text><text x="415.0" y="578.0" font-size="13" font-weight="400" fill="#56657a" text-anchor="middle">초기화 · 이동 · 일시 정지/재개/정지 · 그리퍼 · 무게 · 힘 함수 · 설정 cell.yaml + params.yaml</text><path d="M192 508 L192 528" fill="none" stroke="#8a94a6" stroke-width="2" marker-end="url(#ag)"/><path d="M414 508 L414 528" fill="none" stroke="#8a94a6" stroke-width="2" marker-end="url(#ag)"/><path d="M637 508 L637 528" fill="none" stroke="#8a94a6" stroke-width="2" marker-end="url(#ag)"/><text x="400" y="628.0" font-size="13" font-weight="500" fill="#3d4a5c" text-anchor="middle">기능 함수 12개는 ROS 통신이 아니라 같은 프로세스 안의 파이썬 함수 호출 — 실패는 예외가 아니라 Result.code</text><text x="400" y="650.0" font-size="12.5" font-weight="400" fill="#56657a" text-anchor="middle">(개발 때는 f2_sense_flow.mock 이 같은 이름의 가짜 함수를 준다 → 로봇·남의 코드 없이 flow 시험)</text><rect x="90" y="750" width="360" height="100" rx="8" fill="#eef1f5" stroke="#56657a" stroke-width="2.5"/><text x="270.0" y="780.0" font-size="18" font-weight="700" fill="#1c2430" text-anchor="middle">dsr_controller2 (/dsr01)</text><text x="270.0" y="804.0" font-size="13.5" font-weight="400" fill="#3d4a5c" text-anchor="middle">두산 드라이버 — 강사 배포 m0609_rg2_bringup</text><text x="270" y="838.0" font-size="12" font-weight="400" fill="#3d4a5c" text-anchor="middle">sodreal = bringup mode:=real</text><rect x="560" y="750" width="380" height="100" rx="8" fill="#eef1f5" stroke="#56657a" stroke-width="2.5"/><text x="750.0" y="780.0" font-size="18" font-weight="700" fill="#1c2430" text-anchor="middle">OnRobot RG2 드라이버</text><text x="750.0" y="804.0" font-size="13.5" font-weight="400" fill="#3d4a5c" text-anchor="middle">onrobot_rg_control (OnRobotRGControllerServer)</text><text x="750" y="838.0" font-size="12" font-weight="400" fill="#3d4a5c" text-anchor="middle">강사 배포 · 명령은 문자열 1개</text><path d="M90 266 L74 266 L74 800 L88 800" fill="none" stroke="#2c3440" stroke-width="2.2" marker-end="url(#ak)"/><text x="84" y="712.0" font-size="12" font-weight="500" fill="#2c3440" text-anchor="start">motion/move_joint · move_line · move_pause · move_resume · move_stop</text><text x="84" y="732.0" font-size="12" font-weight="500" fill="#2c3440" text-anchor="start">force/task_compliance_ctrl · set_desired_force · get_workpiece_weight … (dsr_msgs2/srv)</text><path d="M728 600 L728 748" fill="none" stroke="#2c3440" stroke-width="2.2" marker-end="url(#ak)"/><text x="738" y="722.0" font-size="12.5" font-weight="600" fill="#2c3440" text-anchor="start">/onrobot/sendCommand (srv)</text><path d="M880 748 L880 565 L744 565" fill="none" stroke="#d49a1a" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ao)"/><text x="890" y="640.0" font-size="12.5" font-weight="600" fill="#8a6100" text-anchor="start">/onrobot_joint_states</text><text x="890" y="658.0" font-size="12" font-weight="400" fill="#8a6100" text-anchor="start">(JointState — 폭·힘 환산)</text><ellipse cx="270" cy="940" rx="150" ry="44" fill="#fff4d6" stroke="#d49a1a" stroke-width="2.5"/><text x="270" y="936.0" font-size="18" font-weight="700" fill="#1c2430" text-anchor="middle">/dsr01/joint_states</text><text x="270" y="958.0" font-size="13" font-weight="400" fill="#6b4e10" text-anchor="middle">sensor_msgs/JointState</text><path d="M270 852 L270 894" fill="none" stroke="#d49a1a" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ao)"/><rect x="560" y="890" width="180" height="108" rx="8" fill="#f0f0f0" stroke="#555" stroke-width="2"/><text x="650" y="924.0" font-size="15" font-weight="700" fill="#1c2430" text-anchor="middle">M0609 컨트롤러</text><text x="650" y="948.0" font-size="12.5" font-weight="400" fill="#3d4a5c" text-anchor="middle">192.168.1.100</text><text x="650" y="968.0" font-size="12.5" font-weight="400" fill="#3d4a5c" text-anchor="middle">두산 전용 TCP 12345</text><text x="650" y="988.0" font-size="12" font-weight="400" fill="#56657a" text-anchor="middle">(DDS 아님)</text><rect x="770" y="890" width="190" height="108" rx="8" fill="#f0f0f0" stroke="#555" stroke-width="2"/><text x="865" y="924.0" font-size="15" font-weight="700" fill="#1c2430" text-anchor="middle">RG2 Compute Box</text><text x="865" y="948.0" font-size="12.5" font-weight="400" fill="#3d4a5c" text-anchor="middle">192.168.1.1 (설정 웹)</text><text x="865" y="968.0" font-size="12.5" font-weight="400" fill="#3d4a5c" text-anchor="middle">Modbus TCP</text><path d="M450 850 L520 850 L520 944 L558 944" fill="none" stroke="#555" stroke-width="3"/><path d="M865 852 L865 888" fill="none" stroke="#555" stroke-width="3"/><rect x="1110" y="118" width="540" height="910" rx="14" fill="#ffffff" stroke="#2c3440" stroke-width="2.5"/><text x="1132" y="150.0" font-size="17" font-weight="800" fill="#1c2430" text-anchor="start">PC-B · HMI PC (황인재 PC) — 같은 스위치 · DOMAIN 60</text><rect x="1150" y="400" width="460" height="110" rx="8" fill="#f1ebfa" stroke="#7a4fc4" stroke-width="2.5"/><text x="1380.0" y="430.0" font-size="18" font-weight="700" fill="#1c2430" text-anchor="middle">hmi_bridge (패키지 f4_hmi)</text><text x="1380.0" y="454.0" font-size="13.5" font-weight="400" fill="#3d4a5c" text-anchor="middle">rclpy 스레드(구독·서비스 호출) + FastAPI 웹 서버 :8000</text><text x="1380" y="494.0" font-size="12.5" font-weight="400" fill="#5b3a96" text-anchor="middle">보여 주고 전달만 한다 — 흐름·복구 판단은 flow_node</text><path d="M1380 512 L1380 568" fill="none" stroke="#7a4fc4" stroke-width="2.5" marker-start="url(#ag)" marker-end="url(#ag)"/><text x="1392" y="546.0" font-size="12.5" font-weight="500" fill="#5b3a96" text-anchor="start">HTTP · WS · 이 PC 안에서만</text><rect x="1150" y="570" width="460" height="150" rx="10" fill="#fbf8ff" stroke="#7a4fc4" stroke-width="1.8" stroke-dasharray="8 5"/><text x="1380" y="602.0" font-size="16" font-weight="700" fill="#5b3a96" text-anchor="middle">웹 화면 (Next.js 정적 파일 · 브라우저)</text><text x="1380" y="630.0" font-size="13" font-weight="400" fill="#3d4a5c" text-anchor="middle">단계 그림 · 지금 하는 일 · 팔레트 · 수량·소모품 · 이력</text><text x="1380" y="654.0" font-size="13" font-weight="400" fill="#3d4a5c" text-anchor="middle">시작 · 일시 정지 · 재개 · 중단 버튼</text><text x="1380" y="682.0" font-size="12.5" font-weight="500" fill="#3d4a5c" text-anchor="middle">GET /api/state · POST /api/start | stop | resume | abort</text><text x="1380" y="702.0" font-size="12.5" font-weight="500" fill="#3d4a5c" text-anchor="middle">WebSocket /ws/state (실시간)</text><rect x="1150" y="750" width="460" height="70" rx="8" fill="#f6f7f9" stroke="#8a94a6" stroke-width="1.8" stroke-dasharray="7 5"/><text x="1380.0" y="776.0" font-size="15.5" font-weight="700" fill="#2c3440" text-anchor="middle">prewash.db (SQLite) — F4-04 예정</text><text x="1380.0" y="798.0" font-size="13" font-weight="400" fill="#56657a" text-anchor="middle">용기마다 FlowEvent 한 줄 · 이력 조회 GET /api/history</text><rect x="1150" y="850" width="460" height="88" rx="8" fill="#f6f7f9" stroke="#8a94a6" stroke-width="1.8" stroke-dasharray="7 5"/><text x="1380.0" y="876.0" font-size="15.5" font-weight="700" fill="#2c3440" text-anchor="middle">개발용: fake_state_pub (f4_hmi)</text><text x="1380.0" y="898.0" font-size="13" font-weight="400" fill="#56657a" text-anchor="middle">실제 flow_node 대신 같은 토픽·서비스를 대본대로 흉내</text><text x="1380" y="920.0" font-size="12.5" font-weight="400" fill="#56657a" text-anchor="middle">→ 로봇·flow 없이 HMI 개발 (대본 5개: 정상·일시정지·격리·오류·빈 구역)</text><ellipse cx="1060" cy="230" rx="140" ry="46" fill="#fff4d6" stroke="#d49a1a" stroke-width="2.5"/><text x="1060" y="226.0" font-size="18" font-weight="700" fill="#1c2430" text-anchor="middle">/flow/state</text><text x="1060" y="248.0" font-size="13" font-weight="400" fill="#6b4e10" text-anchor="middle">cobot_msgs/FlowState · 2 Hz</text><ellipse cx="1060" cy="340" rx="140" ry="46" fill="#fff4d6" stroke="#d49a1a" stroke-width="2.5"/><text x="1060" y="336.0" font-size="18" font-weight="700" fill="#1c2430" text-anchor="middle">/flow/event</text><text x="1060" y="358.0" font-size="13" font-weight="400" fill="#6b4e10" text-anchor="middle">cobot_msgs/FlowEvent · 용기당 1건</text><path d="M742 232 L918 232" fill="none" stroke="#d49a1a" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#ao)"/><path d="M742 296 L840 296 L840 340 L918 340" fill="none" stroke="#d49a1a" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#ao)"/><text x="830" y="224.0" font-size="12.5" font-weight="600" fill="#8a6100" text-anchor="middle">publish</text><path d="M1202 230 L1300 230 L1300 398" fill="none" stroke="#d49a1a" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#ao)"/><path d="M1202 340 L1250 340 L1250 398" fill="none" stroke="#d49a1a" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#ao)"/><text x="1336" y="262.0" font-size="12.5" font-weight="600" fill="#8a6100" text-anchor="start">subscribe</text><path d="M1148 470 L800 470 L800 268 L744 268" fill="none" stroke="#2c3440" stroke-width="2.6" marker-end="url(#ak)"/><text x="912" y="496.0" font-size="13.5" font-weight="700" fill="#2c3440" text-anchor="middle">/flow/start · /flow/stop</text><text x="912" y="516.0" font-size="13.5" font-weight="700" fill="#2c3440" text-anchor="middle">/flow/resume · /flow/abort</text><text x="912" y="536.0" font-size="12.5" font-weight="500" fill="#2c3440" text-anchor="middle">std_srvs/Trigger · HMI 버튼 4개</text><text x="1070" y="1052.0" font-size="13" font-weight="500" fill="#3d4a5c" text-anchor="middle">DDS: ROS_DOMAIN_ID 60 · 평소엔 PC 마다 격리(solo) · 두 PC 가 통신할 때만 team60</text></svg>