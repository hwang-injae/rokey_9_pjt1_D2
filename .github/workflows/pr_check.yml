# PR이 올라오거나 갱신될 때마다 tools/pr_check.sh 를 실행해 결과를 PR 코멘트로 달고,
# 위반(❌)이 있으면 체크를 실패시킨다. 최종 승인/거절은 황인재가 /pr-review 검토 후 결정한다.
name: pr_check
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: run pr_check
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main:refs/remotes/origin/main
          set +e
          PR_REF=${{ github.event.pull_request.head.sha }} bash tools/pr_check.sh ${{ github.event.pull_request.number }} > result.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat result.txt
      - name: comment result
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const out = fs.readFileSync('result.txt', 'utf8');
            const body = '## 🤖 PR 자동 검토 (tools/pr_check.sh)\n```\n' + out + '\n```\n❌가 있으면 고쳐서 **같은 브랜치에 push** 하면 다시 검사됩니다. 최종 승인/거절은 황인재가 `/pr-review` 검토 후 결정합니다.';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
      - name: fail on violations
        if: steps.run.outputs.code != '0'
        run: exit 1
