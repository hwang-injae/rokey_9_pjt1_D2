# PR이 올라오거나 갱신될 때마다 tools/pr_check.sh 를 실행한다.
#  - ❌(main 충돌 / 빌드 산출물·영상·DB·토큰 커밋)가 있으면 체크 실패 + 코멘트 → 작성자가 고쳐 push
#  - 통과 + **문서만 바뀐 PR**(docs/ 아래만, 인터페이스 정본 docs/02_*·docs/interfaces/ 제외) → PM(황인재) 토큰으로 자동 승인 후 Squash merge
#  - 통과 + **코드·설정·도구가 포함된 PR**(src/ · .github/ · tools/ · .claude/ · 루트 문서 · 인터페이스 정본) → 여기서는 승인·merge 하지 않는다(9/19 변경).
#    PM 에이전트가 바뀐 것을 전부 읽고(.claude/commands/pr-review.md) 승인·Squash merge 또는 거절(황인재 위임)
#  - 제목에 [hold] 가 있거나 라벨 hold 가 붙으면 merge 는 보류
#  - 필요한 저장소 비밀값: PM_TOKEN (hwang-injae 의 Personal Access Token, repo 권한)
name: pr_check
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: run pr_check
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main:refs/remotes/origin/main
          set +e
          PR_REF=${{ github.event.pull_request.head.sha }} bash tools/pr_check.sh ${{ github.event.pull_request.number }} > result.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat result.txt
          # 문서만 바뀐 PR 인가? (docs/ 아래만 + 인터페이스 정본 아님) → review=0 자동 merge / 그 밖 → review=1 PM 에이전트 검토 대기
          FILES=$(git -c core.quotepath=false diff --name-only "origin/main...${{ github.event.pull_request.head.sha }}")   # 한글 파일명이 따옴표·8진수로 나오지 않게
          if echo "$FILES" | grep -vE '^docs/' | grep -q . || echo "$FILES" | grep -qE '^docs/(02_|interfaces/)'; then echo "review=1" >> "$GITHUB_OUTPUT"; else echo "review=0" >> "$GITHUB_OUTPUT"; fi
      - name: comment result
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const out = fs.readFileSync('result.txt', 'utf8');
            const ok = '${{ steps.run.outputs.code }}' === '0';
            const review = '${{ steps.run.outputs.review }}' === '1';
            const tail = ok
              ? (review
                  ? '✅ 기계 검사 통과 — **코드·설정·도구(또는 인터페이스 정본)가 포함된 PR** 이라 자동 merge 하지 않습니다. PM 에이전트가 바뀐 것을 전부 읽고 문제없으면 승인·Squash merge, 문제가 있으면 고칠 곳을 코멘트로 남깁니다. ⚠️ 는 그때 같이 봅니다.'
                  : '✅ 통과 — 문서만 바뀐 PR 이라 PM 토큰으로 자동 승인·merge 됩니다(제목에 `[hold]` 또는 라벨 `hold` 면 승인만). ⚠️ 는 참고 사항입니다.')
              : '❌ 가 있으면 고쳐서 **같은 브랜치에 push** 하면 다시 검사됩니다.';
            const body = '## 🤖 PR 자동 검토 (tools/pr_check.sh)\n```\n' + out + '\n```\n' + tail;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
      - name: fail on violations
        if: steps.run.outputs.code != '0'
        run: exit 1
      - name: auto approve and merge — 문서만 바뀐 PR (PM token)
        if: steps.run.outputs.code == '0' && steps.run.outputs.review == '0' && github.event.pull_request.draft == false
        env:
          GH_TOKEN: ${{ secrets.PM_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "PM_TOKEN 비밀값이 없어 자동 승인을 건너뜁니다 (Settings → Secrets → Actions → PM_TOKEN)"; exit 0; fi
          ME=$(gh api user --jq .login)
          HOLD=0; echo "$TITLE" | grep -qi '\[hold\]' && HOLD=1
          gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qx hold && HOLD=1
          if [ "$AUTHOR" != "$ME" ]; then
            # 같은 head 에 이미 내 승인이 있으면 중복 승인하지 않음
            HEAD=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
            APPROVED=$(gh api "repos/$REPO/pulls/$PR/reviews" --jq "[.[] | select(.user.login==\"$ME\" and .state==\"APPROVED\" and .commit_id==\"$HEAD\")] | length")
            if [ "$APPROVED" = "0" ]; then
              gh pr review "$PR" --repo "$REPO" --approve --body "자동 승인 — tools/pr_check.sh 통과 (main 충돌 없음 · 산출물 없음). PM 황인재 토큰."
            else echo "이미 승인됨"; fi
          else
            echo "작성자가 PM 본인 — 승인 생략(bypass로 merge)"
          fi
          if [ "$HOLD" = "1" ]; then echo "[hold] → merge 보류"; exit 0; fi
          gh pr merge "$PR" --repo "$REPO" --squash --admin --subject "$TITLE" || { echo "merge 실패 — 필수 조건 미충족이면 잠시 후 재실행되거나 수동 merge"; exit 0; }
