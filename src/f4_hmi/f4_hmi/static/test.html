<!doctype html>
<!-- F4-01 시험 페이지 — 꾸밈 없이 "브리지가 /flow/state 를 받아 브라우저까지 전달하는가"만 본다. 진짜 화면(Next.js)은 F4-03. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PreWash-Cell HMI — 시험 페이지</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --dim:#6b7686; --line:#dde2ea; --ok:#1a8f4c; --bad:#c62f2f; --warn:#b7791f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161c; --card:#1b212a; --ink:#e8ecf2; --dim:#93a0b3; --line:#2c3440; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, "Noto Sans KR", sans-serif; }
  h1 { font-size:18px; margin:0 0 12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .dot { width:14px; height:14px; border-radius:50%; background:var(--bad); display:inline-block; }
  .dot.on { background:var(--ok); }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card h2 { font-size:13px; font-weight:600; color:var(--dim); margin:0 0 8px; }
  .big { font-size:40px; font-weight:700; letter-spacing:1px; }
  .big.PAUSED, .big.ERROR { color:var(--bad); } .big.DONE { color:var(--ok); } .big.ISOLATE { color:var(--warn); }
  table { width:100%; border-collapse:collapse; } td { padding:3px 0; } td:last-child { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  .msg { color:var(--bad); min-height:1.5em; word-break:keep-all; }
  .bar { height:10px; background:var(--line); border-radius:5px; overflow:hidden; } .bar i { display:block; height:100%; background:var(--ok); width:0; }
  ol { margin:0; padding-left:20px; max-height:180px; overflow:auto; font-size:14px; } .dim { color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<h1><span class="dot" id="dot"></span><span id="conn">연결 확인 중…</span><span class="dim" id="age"></span></h1>
<div class="grid">
  <div class="card"><h2>지금 단계 (step)</h2><div class="big" id="step">-</div>
    <div id="what" class="dim">-</div><div class="msg" id="message"></div></div>
  <div class="card"><h2>수량</h2><table>
    <tr><td>그릇</td><td id="bowl">-</td></tr><tr><td>컵</td><td id="cup">-</td></tr><tr><td>격리</td><td id="isolated">-</td></tr>
    <tr><td>마지막 코드</td><td id="code">-</td></tr></table></div>
  <div class="card"><h2>소모품</h2><table>
    <tr><td>수세미 사용</td><td id="sponge">-</td></tr><tr><td>세제 담금</td><td id="soap">-</td></tr><tr><td>헹굼 담금</td><td id="rinse">-</td></tr></table></div>
  <div class="card"><h2>그리퍼 · 닦는 힘</h2><table>
    <tr><td>그리퍼</td><td id="grip">-</td></tr><tr><td>닦는 힘</td><td id="force">-</td></tr></table>
    <div class="bar"><i id="forcebar"></i></div></div>
  <div class="card" style="grid-column:1/-1"><h2>최근 이벤트 (용기 1개가 끝날 때마다 1건)</h2><ol id="events"><li class="dim">아직 없음</li></ol></div>
</div>
<p class="dim">시험 페이지 · 0.5초마다 <code>GET /api/state</code> 를 물어본다 · 받은 상태 메시지 <span id="received">0</span>건</p>
<script>
const $ = id => document.getElementById(id);
const FORCE_FULL_N = 12;      // 막대가 꽉 차는 힘 — 시험 페이지의 눈금일 뿐이다
async function tick() {
  let d;
  try { d = await (await fetch('/api/state', {cache: 'no-store'})).json(); }
  catch (e) { $('dot').className = 'dot'; $('conn').textContent = 'HMI 서버(hmi_bridge)에 닿지 않는다'; $('age').textContent = ''; return; }
  $('dot').className = 'dot' + (d.connected ? ' on' : '');
  $('conn').textContent = d.connected ? 'flow 와 연결됨' : (d.state ? 'flow 연결 끊김 — 마지막 값을 보여 주는 중' : 'flow 의 방송을 아직 못 받았다');
  $('age').textContent = d.age_s == null ? '' : `(마지막 수신 ${d.age_s.toFixed(1)} s 전)`;
  $('received').textContent = d.received;
  const s = d.state;
  if (s) {
    $('step').textContent = s.step; $('step').className = 'big ' + s.step;
    $('what').textContent = `${s.kind || '-'} · ${s.zone_id || '-'}`;
    $('message').textContent = s.message || '';
    $('bowl').textContent = `${s.done_bowl} / ${s.target_bowl}`; $('cup').textContent = `${s.done_cup} / ${s.target_cup}`;
    $('isolated').textContent = s.isolated; $('code').textContent = s.last_code;
    const c = d.plan.consumables || {};
    $('sponge').textContent = s.sponge_uses + (c.sponge_max_uses ? ` / ${c.sponge_max_uses}` : '');
    $('soap').textContent = s.soap_dips + (c.soap_max_dips ? ` / ${c.soap_max_dips}` : '');
    $('rinse').textContent = s.rinse_dips;
  }
  $('grip').textContent = d.gripping == null ? '-' : (d.gripping ? '파지 중' : '파지 안 하는 중');
  $('force').textContent = d.force_n == null ? '닦는 중 아님' : d.force_n.toFixed(1) + ' N';
  $('forcebar').style.width = d.force_n == null ? '0' : Math.min(100, d.force_n / FORCE_FULL_N * 100) + '%';
  if (d.events.length) $('events').replaceChildren(...d.events.map(e => {
    const li = document.createElement('li');                // 글자로만 넣는다(메시지 내용이 HTML 로 해석되지 않게)
    li.textContent = `${e.result} · ${e.kind} · ${e.zone_id}${e.rack_slot ? ' → ' + e.rack_slot : ''} · code ${e.code} · ${e.duration_s.toFixed(1)} s`;
    return li;
  }));
}
tick(); setInterval(tick, 500);
</script>
</body>
</html>
