# params.yaml — 기능별 절. 🚨 자기 절만 고친다. (SDD §4.3, IRD §9)
# INF-02a: 로더가 읽을 수 있게 절만 만들었다. 각 절의 키 골격은 INF-04(9/19 오후), 값은 절 주인.
f1: {}        # ── f1 절 (한석형) ──
f2:           # ── f2 절 (민범진) ──
  empty_weight_g:                      # 빈 용기 무게. 잔반 판정 = 측정값 − 이 값
    BOWL: 180                          # 🟡 임시 — 9/19 B V-02 에서 실측
    CUP:  120                          # 🟡 임시 — 9/19 B V-02 에서 실측
  leftover_threshold_g: 50             # 이 이상이면 잔반. 미만은 통과(본세척은 식기세척기)
                                       #   근거 AGENTS.md §1 시나리오 ②
                                       #   V-02 정밀도가 ±20 g 를 못 맞추면 100 으로 올린다(SDD §9.2)
  leftover_max_rounds: 2               # 털고 다시 재는 최대 횟수. 초과해도 넘으면 LEFTOVER_REMAIN → 격리
  weigh_samples: 5                     # 한 번 잴 때 평균낼 횟수 (많을수록 정확·느림)
  weigh_settle_s: 0.5                  # 재기 전 정지 대기. 하중은 흔들리면 튄다(SDD §5.3)
  weigh_reset_timeout_s: 3.0           # 0점 재설정 응답 상한. 넘으면 포기하고 계속(TS-03)
  shake:                               # 털기 — J5/J6 관절 왕복
    WASTE: {amp_deg: 15, cycles: 4, period_s: 0.6}   # 🟡 잔반 털기 — 9/20 A V-07 에서 확정
    RINSE: {amp_deg: 10, cycles: 3, period_s: 0.5}   # 🟡 물 털기(물 없음, 모션만)
  dip:
    RINSE: {depth_mm: 60, hold_s: 1.0}               # 🟡 헹굼 담금 — 수조 배치 후 확정
f3: {}        # ── f3 절 (박진용) ──
flow:         # ── flow 절 (민범진) ──
  plan:                                # 처리 순서: 그릇 구역 2개 → 컵 구역 2개
    - {zone: RET_B, kind: BOWL, count: 2}
    - {zone: RET_C, kind: CUP,  count: 2}
  rack_order:                          # 팔레트에 채울 칸 순서 (그릇 2칸·컵 4칸)
    BOWL: [RACK_B1, RACK_B2]
    CUP:  [RACK_C1, RACK_C2, RACK_C3, RACK_C4]
  policy:                              # 실패 코드별 처리 (IRD §8)
    EMPTY_ZONE:       next_zone        # 구역이 비었다 → 다음 구역 (기록 SKIPPED)
    LEFTOVER_REMAIN:  isolate
    SEAT_FAIL:        isolate
    FORCE_LIMIT:      retry_1_isolate  # 후퇴 후 1회 재시도 → 그래도 실패면 격리
    TIMEOUT:          retry_1_isolate
    RACK_JAM:         retry_1_isolate
    TOOL_FAIL:        retry_1_isolate
    RACK_FULL:        pause            # 팔레트가 찼다 → 멈추고 사람이 교체 후 resume
    ROBOT_ERROR:      pause            # 기능 함수에서 새어 나온 예외 포함
  consumables:
    sponge_max_uses: 20
    soap_max_dips:   60
  state_pub_hz: 2.0                    # /flow/state 발행 주기. IRD §6 = 2 Hz
                                       #   🔔 hmi.state_rate_hz(화면 갱신)와 **다른 값**이다 — 이름을 구분했다
                                       #   hmi.disconnect_after_s(2.0)보다 촘촘해야 HMI 가 끊김으로 오판하지 않는다 (DSN-03)
  step_delay_s: 0.0                    # 기능 함수 사이 대기. 실제 운전은 0.0 (뼈대 시험용)
  records_path: records.csv            # 기록 파일 (실행 위치 기준 상대경로, AGENTS.md 규칙 7)
  use_mock: []                         # 가짜로 돌릴 기능. 예: [f1, f3] · 전부면 드라이버 없이 돈다
                                       #   런치 인자 use_mock 이 이 값을 덮어쓴다
  mock:
    fail_on: []                        # 실패 주입. 예: ["place:SEAT_FAIL", "rack_place:RACK_JAM"]
hmi:          # ── hmi 절 (황인재) ──
  port: 8000                  # HMI 웹 포트
  state_rate_hz: 2            # 화면 갱신 주기
  disconnect_after_s: 2.0     # /flow/state 가 이 시간 넘게 없으면 "연결 끊김"
  db_path: prewash.db         # SQLite 파일 (실행 위치 기준 상대경로)
