# params.yaml — 기능별 절. 🚨 **자기 절만 고친다.** (SDD §4.3, IRD §9)
#
# INF-04(9/19): 절마다 키 골격을 만들었다. 값은 **초안**이다 — 절 주인이 검증 결과로 바꾸고, 값 옆 주석에 단위·범위·바꾼 이유(날짜)를 적는다.
#   - 여러 기능이 같이 쓰는 값(좌표·속도·힘 상한·프리셋)은 여기 두지 않는다 → cell.yaml (한석형).
#   - **키 이름**을 추가·변경하면 팀 채널에 알린다. **값**은 주인 재량(커밋 본문에 이유).
#   - 코드에서는  cc.cfg()['f3']['wipe_bowl']['limit_n']  처럼 읽는다. 숫자를 코드에 쓰지 않는다.

f1:                                   # ── f1 절 (한석형) ── 값은 SDD §4.3 예시, 한석형이 확정
  insert_approach_mm: 20              # 팔레트 삽입 전 힘 감시 하강 거리. 🔄 9/22 밤 30 → 20 (황인재 · 통합 리더 E33): 박진용 실기(#83)에서 RACK_B1 삽입이
                                      #   28.5/30 mm 에서 접촉 타임아웃 10 s(cell.limits.timeout_s) — contact_down 은 3 mm 씩 20 mm/s × vel_scale 로 내려가
                                      #   0.3 배속이면 30 mm 에 10 s 가 넘는다. 감시 구간을 20 으로 줄여 시간 안에 끝내고, 나머지 10 mm 는 자유 하강(free)으로
  tool_return_contact_n: 8            # 툴 반납 때 홀더 바닥 접촉 판정 힘, V-08·F1-03 에서 확정
  place_clear_mm: 100                 # 접근점이 없는 자리에 놓은 뒤 위로 빠지는 높이 — 한석형 티칭 스크립트의 'z +100'(F1-01, 9/20). 접근점이 있는 자리는 내려간 만큼 되올라온다
  isolate_drop_mm: 50                 # 9/23 한석형 실기: BOWL ISOLATE J1 -210 자세에서 BASE Z -50 후 release
  tool_clear_mm: 100                  # 툴을 집은 뒤·반납한 뒤 홀더에서 수직으로 빠지는 높이(접근점이 없을 때) — F1-03·V-08 에서 확정
  contact_timeout_ref_mm: 20          # 🆕 9/23 10:5x 접촉 타임아웃(cell.limits.timeout_s)이 맞춰진 기준 감시 거리(mm). contact_down 은 3 mm 걸음(걸음당 ≈0.8 s ·
                                      #   가속 제한이라 배속과 거의 무관)이라 이보다 긴 감시(재파지 60)는 timeout 을 거리 비례로 늘린다(handling._contact_timeout · PM 제안: 값은 YAML 에)
  regrip_watch_mm: 60                 # 🆕 9/23(황인재 · 총괄 통합) 홈 C 옆면 재파지: 접근점(+100)에서 내려올 때 **마지막 60 mm 는 힘 감시**(cell.limits.insert_limit_n)
                                      #   — 07:55 실기: 관절 이동으로 곧장 가다 열린 그리퍼가 컵에 걸려 SAFE_STOP. 손가락이 컵 테두리에 얹히면 상한에서 멈춰 되올라와 GRIP_FAIL.
                                      #   컵 윗단은 잡는 높이보다 약 45 mm 위라 60 이면 손가락이 컵을 지나는 구간을 다 덮는다.
  tool_return_depth_mm: 20            # 툴 반납 때 홀더 바닥을 찾아 내려가는 최대 깊이. 여기까지 내려가도 안 닿으면 **놓지 않고** TOOL_FAIL (F1-03)
                                      #   🚨 홀더 티칭(CELL-04b)이 정확하면 몇 mm 면 된다 — 크게 잡으면 못 찾았을 때 툴을 깊이 밀어 넣는다

f2:                                   # ── f2 절 (민범진) ── 값은 SDD §4.3 예시, 민범진이 확정
  empty_weight_g:                     # 빈 용기 기준값 — 판정은 (측정값 − 기준값)
                                      # 🚨 저울로 잰 '진짜 무게' 가 아니라 **로봇이 읽은 값**이다.
                                      #    로봇 하중에는 정체불명 옵셋이 있다(V-02: +42~45 g, 원인 미확정).
                                      #    같은 경로·같은 자세로 재야 판정식에서 상쇄된다.
                                      #    저울 값을 넣으면 빈 용기가 잔반 43 g 으로 보인다.
                                      # 재측정: soc && python3 src/f2_sense_flow/test/rig_f2.py empty --kind BOWL
                                      #    브링업을 다시 했으면(다른 세션) 값이 달라질 수 있다 → 시연 날 아침에 다시
    BOWL: -23                         # 🟡 9/23 06:54:56~06:55:17 실기(황인재 · HOME → WEIGH 로 와서 1회 · 빈 그릇 · 흐름 −6 g) — 2회차(96 g) 직전 값
                                      #   🔄 9/23 06:4x 발견: 같은 자세라도 **오는 길**에 따라 60~90 g 다르다(집어 올린 자리에서 바로 −113~−144 · HOME 거쳐 −23~−67).
                                      #   sense.weigh 가 항상 HOME 을 거치도록 통일(9/23) → 이 값도 반드시 rig_f2 empty(HOME 경유)로 잰 값이어야 한다.
                                      #   같은 길 아침 값: −58(06:06:29~06:07:30 · 3회 폭 34) · −64.6(06:31:50) → 40분 사이 +40 g 올라옴(켠 뒤 워밍업으로 봄)
                                      #   이전: −58 (9/23 06:06:29~06:07:30 · 브링업 06:04:57 에서 2분 뒤): −66.9 / −32.6 / −58.2 → −58 · 폭 34 · 3회차 흐름 −32 g(영점 움직임 경고)
                                      #   어제 15:22 값 −12(케이블 정리 뒤 · 폭 20)와 46 g 차 → **켠 직후 힘 센서 드리프트**로 봄. 그릇 한 바퀴 1회차(빈 그릇) 뒤 다시 잰다(2회차 96 g 전).
                                      #   이전: −12 (9/22 15:22 · 63 s 창 3개 −10/−15/−7)
    CUP: 30                           # 🟡 9/23 10:46:09~10:46:29 실기(황인재 · HOME → WEIGH 로 와서 1회 · 빈 컵 · 흐름 −1 g · 떨림 13) — 컵 한 바퀴 직전 값
                                      #   아침 −17(06:16)에서 +47 g 올라옴(그릇도 −58 → −23 · 워밍업) → 기준값은 **실행 직전 1회** 로 잡는 절차 확정
                                      #   이전: −17 (9/23 06:16:30~06:17:11 실기 · 브링업 12분 뒤 · 🔄 시각 정정): −22.7 / +15.5 / −16.6 → −17 · 폭 38 · 매 회차 흐름 경고(+24/+35/−51 g) — 켠 직후 드리프트
                                      #   이전: −20 (9/22 20:27 · 3회 폭 20). 컵 한 바퀴(13:30) 전에 다시 잰다
  leftover_threshold_g: 50            # 잔반 판정 임계 (SR-05). V-02 정밀도 미달이면 100 (SDD §9.9)
                                      # 🟡 9/22 F4 제안 "50 → 100" 은 **보류**(민범진): 11:3x 측정(⚠ TCP 풀림 시간대)에서 +107 g 이 +86 g 으로
                                      #    읽혔다(이득 ≈ 0.8). 100 이면 대용품 107 g 을 놓칠 수 있다. 표본 창 21 s 로 흔들림을 먼저 지우고,
                                      #    INT-12a 에서 같은 경로로 빈 그릇·대용품을 재서 정한다(후보 70). 그 전까지 50 · 빈 그릇 흔들림 ±22 < 50
  weigh_samples: 30                   # weigh() 중앙값 표본 수 (× weigh_sample_gap_s 0.7 → 약 21 s 창)
                                      # 🔄 9/22 5 → 10 → 30 (민범진 · F4 V-02 1차 14:00 반영): 정지해도 ±22 g 가 **10~20 s 주기**로 오르내린다
                                      #    (TCP 복구 뒤에도 그대로 · 폭 44.8 g). 창이 한 주기(≤ 20 s)보다 길어야 중앙값이 흔들림을 지운다 → 21 s.
                                      #    값은 용기당 무게 1회 ≈ 5 + 21 s. 잔반이면 최대 3회(≈ 80 s) — 시연 그릇 2개 기준 감수(정확도 우선)
  weigh_sample_gap_s: 0.7             # 🆕 9/22 읽기 사이 간격(s). 🚨 0 이면 컨트롤러 갱신 전에 같은 값을 반복해 읽는다(12:12 실기: 50 개 전부 −48.7)
  weigh_settle_s: 5.0                 # 재기 전 정지 대기 — 하중은 흔들리면 튄다 (SDD §5.3)
                                      # 🔄 9/22 실기(민범진 R2): 도착 뒤 약 5 s 동안 +30 g 높게 읽히다 가라앉는다(117 → 85 g)
                                      #    → 0.5 에서 5.0 으로. max_settle_s(5.0) 와 같다 — 더 올리려면 상한도 같이
  weigh_reset_timeout_s: 3.0          # 0점 재설정 응답 상한. 넘으면 포기하고 계속 (TS-03)
  limits:                             # 🚨 오타 방어 — 넘는 값이 들어오면 **움직이기 전에** 거절한다
                                      #    (amp_deg 를 15 대신 150 으로 적으면 용기를 쥔 채 300° 를 왕복한다)
    max_amp_deg: 45                   # 털기 진폭 상한
    max_tilt_deg: 100                 # 🆕 털기 전 기울이기 상한(|tilt_deg|) — 90 이면 입이 정확히 아래
    max_amp_mm: 60                    # 🆕 직선 왕복 진폭 상한(mm) — 수조 안에서 벽까지 여유
    max_depth_mm: 150                 # 담금 깊이 상한 (수조 깊이 − 용기 높이보다 작아야 한다 — V-07)
    max_hold_s: 5.0                   # 한 번 유지 시간 상한
    max_settle_s: 5.0                 # 재기 전 정지 대기 상한
    max_weigh_drift_g: 20             # 🆕 9/22 저녁 📉 영점 흐름 경고 — 재는 21 s 안에서 값이 한 방향으로 이 이상 움직이면 경고(멈추지 않음).
                                      #   18:11 실기: 30 표본이 −96 → −123 으로 **−26 g 미끄러졌다**. 영점이 움직이는 중이면 5 시간 전 기준값은 못 쓴다
                                      #   → 잔반 판정을 믿지 말고 rig_f2.py empty 로 다시 재라는 신호. 🟡 임시 — 정상 창의 흐름을 보고 조정
    max_weigh_spread_g: 50            # 🆕 9/22 🔗 케이블 장력 경고 — weigh() 표본의 **떨림**(추세를 뺀 10~90 % 폭)이 이보다 크면 경고(멈추지 않음).
                                      #   🔄 9/22 저녁: '퍼짐' → '떨림' 으로 바꿨다 — 흐름이 섞이면 거짓 경보가 난다(그날 퍼짐 52 인데 떨림은 12).
                                      #   황인재 V-02: 케이블 정리 뒤 21 s 창 ±12~17(폭 ≈ 25~35) · 정리 전 ±25(폭 45~70). 🟡 임시 — 저녁 실기 값으로 조정
    min_net_g: -60.0                  # 🚨 잔반 무게가 이보다 작으면 **파지를 의심한다** — 🔄 9/22 저녁: 바로 GRIP_FAIL 이 아니라
                                      #    **그리퍼 폭으로 한 번 더 확인**한다(sense._held_by_width). 폭이 빈손이면 GRIP_FAIL,
                                      #    쥐고 있으면 '기준값(empty_weight_g)이 낡았다' 고 경고만 하고 지나간다(잔반 판정은 그 바퀴만 못 믿는다).
                                      #    왜: 18:11 실기에서 −12 g 자리가 −117.5 g 으로 읽혀(툴 무게 등록 등 영점 이동) 멀쩡한 그릇이 GRIP_FAIL 로 막혔다
                                      #    빈손이면 하중이 옵셋만 남아 net 이 크게 음수가 된다
                                      # 🔄 9/22 −30 → −60 (민범진 · F4 V-02 1차 14:00 · F4 제안 채택): 정지 흔들림 폭 44.8 g(±22)이 TCP 복구 뒤에도
                                      #    그대로라 −30 이면 빈 그릇도 걸린다. 빈손은 그릇 대비 약 −85 g → −60 이면 놓침은 잡는다.
                                      #    (앞서 "복구 뒤 9.5 g" 이라 적은 것은 F4 1차 결과로 **정정** — 45 g 이 맞다)
                                      #    컵은 E25 로 무게 단계 자체가 없어져 이 문턱과 무관
  slip_tol_mm: 1.0                    # ✅ 9/21 V-05·V-01·V-23 실기로 확정(값은 그대로 · 근거가 생겼다)
                                      #    털기·담금 전후 그리퍼 폭이 이보다 변하면 미끄러진 것(GRIP_FAIL)
                                      #    아래 셋 사이에 들어가야 한다 — 1.0 이 가운데다:
                                      #      0.20 mm  폭 읽기 흔들림 (V-05 최대)
                                      #      0.70 mm  V-23 첫 NORMAL→HOLD 전환의 정상 변화 ← 이보다 커야 헛경보가 안 난다
                                      #      2.15 mm  그릇 파지 폭 (V-01) ← 이보다 작아야 진짜 놓친 것을 잡는다
                                      #    🚨 컵에는 쓰지 않는다 — 컵은 폭으로 판정하지 않는다(9/21 결정 E19)
  shake:                              # joint = 흔들 관절(1~6). 🟡 V-07 에서 J5/J6 중 확정 (SDD §5.3)
                                      # period_s = **한 주기** 시간. shake() 가 구간별로 나눠 쓴다
                                      #   (가운데↔끝 = period/4, 끝↔반대끝 = period/2 — 황인재 9/20)
    WASTE: {joint: 5, amp_deg: 15, cycles: 4, period_s: 0.6, tilt_deg: -90}   # 잔반 털기, V-07 에서 조정
                                      # 🆕 9/22 tilt_deg (민범진 · V-07 실기): 똑바로 든 채 흔들면 입이 위를 봐서 고형 잔반이 안 쏟아진다
                                      #   → 흔들기 전에 J5 를 tilt_deg 만큼 기울여(입이 잔반통 쪽) 그 자세를 가운데로 ±amp 흔들고 되돌린다.
                                      #   ✅ 9/22 12:45 rig_jog 실기(민범진): J5 90 → 0 (−90°)에서 입이 잔반통 쪽 · 쏟아지는 각도.
                                      #      그때 posj [-180, 0, 90, 0, 0, 180] · posx z 544 (그릇이 잔반통 위 높이). 상한 limits.max_tilt_deg
                                      #   ±30°·1.0 s 로 키워 봤던 것은 되돌림(똑바로 든 채라 의미 없었다)
    RINSE:                            # 물 털기 — 🔄 9/23 결정 E36(황인재): 담금 2회 뒤 **위로 곧게 빼서(접근점 z 235) 4번 관절 좌우 왕복** · 수조 안 J5 까딱(#71)은 폐기
                                      #   at: RINSE_SHAKE → 접근점(수조 위 235)까지 곧게 올라온 뒤 관절 이동으로 털기 자세(cell.stations.RINSE_SHAKE · 황인재 티칭 9/23)로 가서 턴다 · 끝나도 거기(높은 자세)
                                      #   at: approach 로 두면 접근점에서 바로 턴다(9/23 07:5x 실기: 밋밋해서 안 씀)
                                      #   smooth: true → 왕복을 관절 스플라인 한 번(amovesj)으로 — 구간마다 서지 않고 +amp ↔ −amp 를 한 곡선으로(황인재 9/23 08:1x: "3단계로 보인다")
                                      #   fast: true → vel_scale 예외(E17 취지 · cc.move_joint_rel scale=False) — 배속을 낮춰도 설정한 주기로 턴다. 상한 100 °/s(cell.motion) 그대로
                                      #   🟡 값은 9/23 첫 실기(황인재)로 조정 — rig_shake_tune --mode RINSE 로 a/A(진폭) p/P(주기) 바꿔 보고 w 로 찍는다
                                      #   period_s = 한 주기 → 속도 = 4·amp/period(deg/s) · acc_deg_s2 = 가속도. 상한은 cell.motion.vel/acc_joint_fast_max(180 · 600 · 물 털기 전용 · 두산 손목 한계 225 아래)
      BOWL: {joint: 4, amp_deg: 30, period_s: 0.7, acc_deg_s2: 600, at: RINSE_SHAKE, fast: true, smooth: true}   # 그릇 — 털기 자세(z 600 · 툴 옆으로)에서 J4 ±30° · 평균 171 °/s(전용 상한 180) · 가속 600 · 🔄 9/23 08:2x 황인재 "사람이 물 털 듯 빠르게"
      CUP:  {joint: 4, amp_deg: 15, period_s: 0.8, acc_deg_s2: 400, at: RINSE_SHAKE, fast: true, smooth: true}   # 컵 — 🔄 9/23 10:1x 옆면 재파지 기준(E38 · CUP_SIDE 70 mm·10 N · HOLD 못 세게)으로 낮춤 · 🟡 첫 컵 헹굼 실기로 조정(벽 집기 실기값은 ±25°·0.7 s·600 이었음)
                                      #   직선 왕복이 필요하면 {axis: x, amp_mm: 20, period_s: 0.5, acc_mm_s2: 800} (코드 있음 · 상한 max_amp_mm · fast 불가)
  dip:                                # depth_mm = **티칭 자세에서** 내려가는 거리 (SDD §5.3)
    RINSE: {depth_mm: 60, hold_s: 1.0}                # 헹굼 담금, 60 확인은 V-07

f3:                                   # ── f3 절 (박진용) ── 값의 주인은 박진용. 초안 출처: docs/test_logs/20260918_CELL-02a_용기치수측정.md §4 (SDD §4.3 예시와 다름)
                                      # 🔸 툴 파지 기준(9/20 확정): 그리퍼 끝을 **세척부 윗면에 닿게** 잡는다
                                      #    → 그리퍼 끝 ~ 툴 끝 거리 = 세척부 높이(tool.clean_h_mm).
                                      #    하강 거리·삽입 깊이·닦는 반경을 이 값으로 계산한다(길이를 코드에 적지 않는다).
  soap:                               # 세제 담금 — 접촉 동작이 아니다(수조 안은 비어 있다). 좌표는 cell.stations.SOAP (종류별)
    depth_mm: 40                      # 담그는 깊이 — 티칭한 담금 시작 자세에서 이만큼 내려갔다 올라온다 (CUP·기존 방식)
    hold_s: 0.5                       # 다 내려간 자리에서 머무는 시간 (세제가 묻는 시간)
    vel_mm_s: 80.0                    # 담금·왕복 상하 속도 (× vel_scale) — 빠르면 세제가 튄다
    log_dir: logs/f3                  # (soap 은 힘 로그를 쓰지 않는다 — wipe_* 와 같은 폴더만 맞춰 둔다)
    # ── BOWL 전용(9/22 박진용) — 수세미를 SOAP 자리로 옮기지 않고, 집은 자리에서 바로 한다 ──
    # 🔧 move_joint_rel·move_rel 은 vel_scale 로 강제로 깎여서(30°/s·120mm/s 상한) 아무리 값을 올려도 안 빨라졌다.
    #    결정 E17("세척 동작 속도는 vel_scale 예외")과 같은 방식으로 move_periodic(scale=False) 로 바꾼다(9/22).
    twist_deg: 20.0                   # 좌우 비틀기 각(±, 6번 관절) — 박진용 지시(9/22)
    twist_cycles: 3                   # 비틀기 반복 횟수(=move_periodic repeat)
    twist_period_s: 1.0               # 한 왕복(+·-) 주기 — 최고 속도 2π×20/1.0 ≈ 126°/s(로봇 한계 225°/s 안, 첫 시험은 보수적으로)
    updown_mm: 5.0                    # 위아래 왕복 편진폭 — 박진용 지시(9/22)
    updown_cycles: 2                  # 왕복 반복 횟수(=move_periodic repeat)
    updown_period_s: 0.3              # 한 왕복 주기 — 최고 속도 2π×5/0.3 ≈ 105mm/s(하드웨어 상한 1000mm/s 안, 첫 시험은 보수적으로)
    ramp_s: 0.2                       # Periodic 시작·끝 완만하게(컵과 같은 목적)
    rot_vel_limit_deg_s: 225.0        # 🚨 로봇 회전 속도 한계(AngularVelLimit, 컵과 같은 값) — 넘으면 컨트롤러가 거절
    duration_s: 60                    # 🔧 soap 동작 전체 시간 상한 — cell.limits.timeout_s(10, 접촉 전용)를 잘못 빌려 쓰던 버그 수정(박진용 9/22)
                                      #   🔧 상승 거리는 더 이상 여기 없다 — cell.yaml stations.HOME.posx_z_mm 까지 실시간 계산(박진용 9/22 2차, rise_mm 근삿값 제거)
    tool_split_x_mm: 349.0            # 🔧 9/22 4차: 폭 판정은 그리퍼 힘 버그 때문에 컵솔(목표 5mm)이 헐겁게 잡히면 수세미로
                                      #   오판해 엉뚱한 위치(HOME)로 가서 SAFE_STOP까지 났다(9/22 실기) — **잡은 위치(BASE X)로 판정**.
                                      #   TOOL_SPONGE 홀더 실측 X ≈ 273 · TOOL_BRUSH 홀더 실측 X ≈ 425(9/22) — 둘 사이 중간값.
                                      #   지금 X 가 이보다 크면 컵솔(soap 끝나고 컵 위까지 더 감), 작으면 수세미(HOME 에서 끝)
  wipe_bowl:                          # 그릇 닦기 — 값의 근거는 V-03 9/20 실기
                                      #   🔸 **9/20 실기(V-03)로 확정한 절차 그대로**다: 바닥 찾기 → 순응 → 나선 → 힘제어 1.5 N → 벽면 → 복귀.
                                      #   🚨 **벽만 찾지 않는다**(결정 E6): 벽 반지름을 그릇·툴 지름으로 계산한다.
                                      #      결정 E6 ①(바닥도 고정 높이) · ②(벽면 힘제어 없음) 과는 다르므로 PM 확인 대상.
    tool:                             # 그릇용 수세미 (세척부) — 파지 기준은 위 주석
      clean_h_mm: 35                  # 높이 (실측 9/20). 그릇 깊이 45 보다 낮아 그리퍼가 테두리에 닿지 않는다
      d_mm: 90                        # 지름 (CELL-02a 실측)
    # ── 바닥까지 내려가기 (빠르게 → 힘으로 찾기. 9/20 실기 방식, 박진용 9/21 확정) ──
    fast_down_mm: 140.0               # 초기자세 HOME(그릇 바로 위)에서 **이 길이만큼 빠르게** 내려가고, 그 아래는 힘으로 찾는다
                                      #   9/21 실측: HOME 에서 수세미 ~ 그릇 바닥 145 mm (실기 5 회 바닥 145.1~146.4)
                                      #   → 135 에서 140 으로(박진용 9/21): 바닥 찾기가 힘제어라 속도를 못 정한다 → 남은 거리를 약 5 mm 로 줄인다
                                      #   (9/21 실기: 144 mm 까지는 2 N 미만 = 아직 안 닿음)
                                      #   🔸 바닥 위치는 미리 정하지 않는다 — 바닥은 contact_down 이 찾는다(박진용 9/21)
    # 🔸 9/21 박진용: 그릇 닦기는 **9/20 실기에서 나선까지 돈 rig_v03(src/cobot_common/test/rig_v03.yaml) 값 그대로**다.
    #    9/21 실기에서 다른 값으로 옮긴 판은 나선이 4 번 모두 시작하지 않았다(바닥 6~7 N) → 전부 되돌렸다. 컵과 같게 맞추지 않는다.
    home_vel_deg_s: 40.0              # HOME 관절 이동 속도 (× vel_scale → 12 °/s) — rig_v03 home_vel_deg_s (공용 이동 속도를 쓰지 않는다)
    home_acc_deg_s2: 40.0             #   가속도 (그대로) — rig_v03 home_acc_deg_s2
    fast_vel_mm_s: 220.0              # 빠른 하강 속도 (× vel_scale → 66 mm/s) — 박진용 지시(9/22): 컵과 같은 방식(vel_scale 적용)으로 맞추고 값도 올림
    fast_acc_mm_s2: 440.0             #   가속도 (× vel_scale) — 컵과 같은 배율(2배)로 맞춤. rig_v03 원값(200/200, 가속 미적용)에서 변경
    air_force_max_n: 3.0              # 빠른 하강 뒤 공중 |Fz| 가 이보다 크면 중단(툴 무게·접촉 확인) — rig_v03 air_force_max_n
    find_max_mm: 30.0                 # 바닥을 찾으며 더 내려갈 수 있는 최대 — rig_v03 contact_max_depth_mm
    find_limit_n: 3.0                 # 🔸 바닥 판정 힘(공중 기준 대비) — **그릇 전용** 3 N (박진용 9/21). cell.limits.contact_limit_n(2 N)을 쓰지 않는다
                                      #   찾는 법은 rig_v03 그대로: cc.contact_down(3 mm 걸음 · 걸음 끝마다 확인) — 판정 힘만 2 → 3 N
    contact_timeout_s: 40.0           # 바닥 찾기 시간 상한 — rig_v03 설정(cell.limits.timeout_s 10 대신)
    press_vel_mm_s: 20.0              # 순응을 켠 뒤 찾은 높이로 되돌리는 속도 (× vel_scale) — rig_v03
    press_acc_mm_s2: 50.0             #   가속도 (그대로)
    # 곧게 올라오기는 **빠른 하강과 같은 값**(fast_vel_mm_s · fast_acc_mm_s2)을 쓴다 (박진용 9/21)
    # ── 누르는 힘 (벽면 구간에서만 힘제어로 유지한다 — 바닥 나선 중에는 켜지 않는다) ──
    target_force_n: 1.5               # 벽면을 닦는 동안 유지할 누르는 힘 (V-03 9/20 실기 확정).
                                      #   공중 기준값(센서 치우침·툴 무게)은 코드가 더해서 명령한다
                                      #   🟡 FR-08 은 3~5 N 이지만 수세미는 면이 넓어 1.5 N 로도 눌린다
    limit_n: 10.0                     # 누르는 힘 상한 (공중 기준값 대비) — 넘으면 즉시 후퇴 FORCE_LIMIT
    lateral_max_n: 25.0               # 옆 힘 상한 — 그릇이 밀리거나 툴이 걸린 것
    # ── 바닥 나선 (좌우 비틀기 없음) ──
    bowl_inner_d_mm: 110.0            # 그릇 안지름 → 벽 반지름 = (이 값 − tool.d_mm)/2 + wall_press_mm = 14 mm
                                      #   🚨 수세미가 로봇 순응보다 훨씬 물러 벽에 눌려도 힘이 잡히지 않는다 → 힘이 아니라 **크기로** 계산(결정 E6)
    wall_press_mm: 4.0                # 벽을 이만큼 밀면서 돈다 — 그릇이 조금 틀어져도 한 바퀴 내내 닿게
    spiral_pitch_mm: 5.0              # 나선이 한 바퀴에 넓어지는 반지름 → 반지름 14 mm 면 약 2.8바퀴
    spiral_time_s: 3.0                # 나선에 걸리는 시간 — 🚨 나선은 속도가 아니라 **시간**으로 지정(중급1 p.69). **vel_scale 을 곱하지 않는다**(9/21 — ÷0.3 = 10 s 는 실기에서 안 움직였다)
                                      #   반경 대비 회전 수가 과하면(14 mm 에 7바퀴·1.5 s) 시작조차 하지 않는다
    # ── 벽면 회전 (반대 방향 + 좌우 비틀기) ──
    turns: 3                          # 벽면을 도는 바퀴 수
    wall_arc_deg: 90.0                # 원호 하나의 각도 (90° = 한 바퀴 4개). 작을수록 비틀기가 잦다
    wall_approach_vel_mm_s: 60.0      # 벽으로 밀어 붙일 때 속도 — 한 번에 튀어나가면 벽을 세게 박는다
    twist_deg: 18.0                   # 손목 좌우 비틀기 각(±, 6번 축). 키우면 문지르는 거리가 늘고 시간도 비례한다
    blend_radius_mm: 3.0              # 원호를 이어 붙이는 거리 — 0 이면 원호마다 멈춰 작업대가 울린다(9/20)
    lin_vel_mm_s: 600.0               # 벽면·중심 복귀 이동 속도 (× vel_scale → 180 mm/s) — rig_v03 scrub_lin_vel_mm_s
                                      #   🚨 vel_scale 1.0 이면 cell.motion.vel_tcp_max_mm_s(400)에서 잘린다
    rot_vel_deg_s: 400.0              # 손목 회전 속도 (× vel_scale) — 더 올리면 경고음(9/20) — rig_v03 scrub_rot_vel_deg_s
    lin_acc_mm_s2: 3000.0             # 벽면·중심 복귀 가속도 (그대로) — rig_v03 scrub_lin_acc_mm_s2
    rot_acc_deg_s2: 1000.0            # 손목 회전 가속도 (그대로) — rig_v03 scrub_rot_acc_deg_s2 (4000 은 경고음)
    # ── 감시·기록 ──
    force_every: 4                    # 원호 몇 개마다 힘을 확인할지 — 매번 읽으면 로봇이 서서 작업대가 울린다(9/20)
    sample_s: 0.05                    # 나선 도는 동안 힘 기록 주기
    duration_s: 120                   # 닦기 전체 타임아웃 → TIMEOUT
    log_dir: logs/f3                  # 힘 로그 CSV (실행 위치 기준 상대경로)
  wipe_cup:
    tool:                             # 컵용 솔 (세척부)
      clean_h_mm: 95                  # 길이 = 컵 내부 높이 95 (9/19 그리퍼 끝 ~ 솔 끝 실측 95 와 일치)
      d_mm: 55                        # 끝 지름 실측 Ø50~60 의 가운데
    # ── 바닥 찾기 (그릇과 달리 컵은 힘으로 찾는다 — 깊고 솔이 단단해 높이가 어긋나면 바로 박힌다) ──
    # ── 컵 위로 가기 — 시작·끝은 초기자세 HOME. HOME 높이에서 옆으로 바로 가면 솔이 컵에 걸린다(박진용 9/21) ──
    over_cup_up_mm: 40.0              # HOME 에서 먼저 올리는 높이 — 🔧 9/22 2차: 더 이상 다시 안 내려온다, 이 높이가 세척 시작점(cup_hops)
    over_cup_dy_mm: 140.0             # 그다음 BASE y 로 이만큼 → 컵 위(= 세척 시작점, HOME + over_cup_up_mm)
    fast_down_mm: 120.0               # 🔧 9/22 2차: 80 → 120(= 원래 80 + over_cup_up_mm 40) — 시작점이 40mm 높아진 만큼 그대로 더한다.
                                      #   컵 위(= HOME + over_cup_up_mm)에서 **이 길이만큼 빠르게** 내려가고, 그 아래는 힘으로 찾는다
                                      #   9/21 실측(HOME 높이 기준): 컵 위에서 솔 ~ 컵 바닥 90 mm → 10 mm 남기고 80 + 40 = 120. 실기 확인 필요.
                                      #   🔸 바닥 위치는 미리 정하지 않는다 — 바닥은 contact_down 이 찾는다(박진용 9/21)
    fast_vel_mm_s: 220.0              # 빠른 하강 · 곧게 올라오기 속도 (× vel_scale → 0.3 에서 66 mm/s) — **그릇·컵 같은 값**(박진용 9/22 재확인·상향)
    fast_acc_mm_s2: 440.0             #   가속도 (× vel_scale) — 그릇과 같은 배율(2배) (박진용 9/22)
    find_max_mm: 40.0                 # 바닥을 찾으며 더 내려갈 수 있는 최대. 다 내려가도 못 찾으면 오류
    find_limit_n: 5.0                 # 바닥으로 판정하는 힘(시작 대비) — **컵 전용**. cell.limits.insert_limit_n(15, F1 팔레트 삽입과 공용)을 쓰지 않는다
                                      #   9/21 실기: 15 N 이면 컵이 스펀지 홈에 쑥 눌렸다 · 5 N 이면 5.1~5.7 N 에서 멈추고 컵이 안 움직였다(박진용)
    # ── 세척 — **Move Periodic 한 명령**: 위아래 ±stroke 와 6번 조인트 ±spin/2 를 같은 주기로 (박진용 9/21) ──
    #    기준은 **TOOL** — z = 그리퍼 축 방향 위아래 · **rz = 그리퍼 축 회전 = 6번 조인트**(두산 정의)
    #    🚨 9/21: 실기 TOOL rx → 4번 조인트(정의대로) · Virtual 은 rx ↔ rz 를 뒤바꿔 움직였다 → Virtual 결과를 믿지 않는다
    #       BASE rz 는 Virtual 에서 1·4번 조인트를 돌렸다 → 쓰지 않는다. 도는 동안 1·4번 조인트를 감시한다
    lift_mm: 3.0                      # 세척의 **가장 낮은 곳 = 바닥 + 이 값** (박진용 9/21) → 세척 범위 바닥 + 3 ~ 33 mm
                                      #   Periodic 은 시작 자리를 가운데로 위아래 똑같이 움직여서, 코드는 바닥 + 3 + stroke 에서 시작한다
    lift_vel_mm_s: 40.0               # 띄우기·마무리 하강 속도 (× vel_scale)
    stroke_mm: 15.0                   # 위아래 **편진폭** — 한 번 오르내리면 30 mm = 3 cm (박진용 9/21)
                                      #   9/21 실기: 3 mm 는 움직임이 안 보였고 · 4 cm 는 길다 → 3 cm
    spin_deg: 180.0                   # 6번 조인트가 도는 폭 → Periodic 회전 진폭 = **좌우 ±90°** (박진용 9/21 · ±180 → ±120 → ±90)
    period_s: 2.6                     # 🔧 9/22 박진용 2차: 3.0 → 2.6(하한, 2π×90/2.6=217°/s — 로봇 한계 225°/s 턱밑) — 실기 확인, 안 되면 3.0 으로 원복
                                      #   한 번 오르내리는 시간 — **실제 값, vel_scale 을 곱하지 않는다**(결정 E17)
    rot_vel_limit_deg_s: 225.0        # 🚨 이 로봇의 툴 회전 속도 한계(AngularVelLimit) — 넘으면 컨트롤러가 Periodic 을 거절한다
                                      #   9/21 실기 알람 1212: "Rotation Vel(251.327) exceeds AngularVelLimit(225.000)" (주기 3 s)
                                      #   → 코드가 **내려가기 전에** 계산해서 넘으면 바로 멈춘다
    cycles: 5                         # 오르내리는 횟수 · 9/21 박진용 (3 → 5)
    ramp_s: 1.5                       # Periodic 시작·끝을 이 시간에 걸쳐 천천히 — 혹시 다른 조인트가 움직여도 느릴 때 감시가 잡는다
    joint_guard_deg: 1.0              # 도는 동안 1·4번 조인트가 이만큼 넘게 움직이면 즉시 정지 → ROBOT_ERROR (6번 조인트만 돌아야 한다)
    j6_limit_deg: 360.0               # 6번 조인트 한계 (M0609 ±360°)
    j6_margin_deg: 10.0               # 시작 각 ± spin_deg/2 가 한계에서 이만큼은 남아야 돈다 — 안 되면 ROBOT_ERROR
    keep_in_mm: 10.0                  # 왕복 꼭대기(바닥 + lift + 2×stroke)에서도 솔이 이만큼은 컵 안에 남게
                                      #   — 바닥에서는 솔 세척부(95 = 컵 깊이)가 통째로 들어가 있으므로 2 + 40 = 42 mm 올라가도 53 mm 가 남는다
    # ── 감시·기록 ──
    limit_n: 10.0                     # NFR-01 닦기 10 N — 넘으면 즉시 후퇴 FORCE_LIMIT
    lateral_max_n: 25.0               # 옆 힘 상한 — 솔이 컵 벽에 걸리거나 컵이 딸려 올라오는 것
    sample_s: 0.05                    # 왕복 도는 동안 힘 기록 주기
    duration_s: 120                   # 닦기 전체 타임아웃 → TIMEOUT
    log_dir: logs/f3                  # 힘 로그 CSV (실행 위치 기준 상대경로)

flow:                                 # ── flow 절 (민범진) ── 🟡 계획·정책은 DSN-03 에서 확정
  plan:                               # 구역 계획: 위에서부터 차례로, 구역마다 count 개 또는 EMPTY_ZONE 까지
    - {zone: RET_B, kind: BOWL, count: 2}
    - {zone: RET_C, kind: CUP, count: 2}
  rack_order:                         # 칸 배정 순서
    BOWL: [RACK_B1, RACK_B2]
    CUP: [RACK_C1, RACK_C2]           # 컵 2칸 (9/20 결정: 4 → 2)
  policy:                             # 실패 정책 (IRD §8): next_zone · isolate · retry:N->isolate · pause
    EMPTY_ZONE: next_zone
    LEFTOVER_REMAIN: isolate
    GRIP_FAIL: pause                  # 털기·담금 중 미끄러짐(f2) · 빈손 감지(f2 weigh)
                                      # ✅ 9/20 결정 E12(황인재 17:25) — 격리가 아니라 **멈추고 사람이 확인**한다.
                                      #    놓쳤다면 용기가 손에 없을 수 있어 격리 동작(옮기기)이 의미가 없고,
                                      #    바닥에 떨어진 용기를 다음 동작이 칠 수 있다.
                                      #    확인 뒤 resume = 그 단계부터 다시 / abort = 그 용기를 접고 다음 용기
                                      #    (IRD §8 · SDD §7 표에 행이 들어가 있다. pick 안의 헛잡음은 F1 이 소화)
    SEAT_FAIL: isolate
    FORCE_LIMIT: "retry:1->isolate"
    TIMEOUT: "retry:1->isolate"
    RACK_JAM: "retry:1->isolate"
    TOOL_FAIL: "retry:1->isolate"
    RACK_FULL: pause
    ROBOT_ERROR: pause
  consumables: {sponge_max_uses: 20, soap_max_dips: 60}
  weigh_kinds: [BOWL, CUP]            # 🔄 9/22 저녁 황인재 결정: **E25 되돌림** — 컵도 무게 측정·잔반 버리기(그릇과 같은 흐름). WEIGH.CUP 새 자세 · 기준값 CUP 은 V-02 컵으로 다시
                                                 # 🆕 FLOW-05 (결정 E25 · 9/22): 무게 단계(move_to WEIGH · leftover_loop)를 **하는** 종류.
                                      #   🟡 **임시 건너뛰기다 — 시나리오가 바뀐 게 아니다**(민범진 9/22): 컵 무게 측정(기준값 · WEIGH 자세 · 놓침 판정)이
                                      #   아직 미완성이라 동결 전에 컵 쪽만 잠시 뺀 것. 완성되면 [BOWL, CUP] 으로 되돌린다(코드 변경 없음).
                                      #   컵도 헹굼 담금·물 털기는 한다. 키를 지우면 전부 잰다(예전 동작)
  leftover_max_rounds: 2              # f2.leftover_loop(kind, N) 의 N — 털고 다시 재는 최대 횟수
                                      #   flow 가 넘기는 인자라 flow 절에 둔다 (DSN-03 B8 PM 제안)
  counts:                             # 용기 1개를 처리할 때 기능 함수에 넘기는 횟수 (IRD §8 호출 순서)
    soap_dips: 3                      # f3.soap(count) — 세제 담금
    rinse_dips: 2                     # f2.dip('RINSE', count) — 헹굼 담금
                                      # 🔄 9/22 1 → 2 (민범진 · V-07 실기 뒤 결정): 담금 1회는 헹굼으로 부족해 보여 2회. 회당 약 6 s
    rinse_shakes: 3                   # f2.shake('RINSE', count) — 물 털기
                                      #   🔔 f2.shake('WASTE', …) 의 횟수는 leftover_loop 안에서
                                      #      f2 절의 shake.WASTE.cycles 를 쓴다(여기 아님)
  done_hold_s: 1.0                    # plan 완료 뒤 step='DONE' 을 유지하는 시간.
                                      #   state_pub_hz 주기보다 길어야 HMI 가 완료를 본다
  state_pub_hz: 2.0                   # /flow/state 발행 주기 (IRD §6 = 2 Hz)
                                      #   🔔 hmi.state_rate_hz(화면 갱신)와 **다른 값**이라 이름을 구분했다.
                                      #   hmi.disconnect_after_s 보다 촘촘해야 HMI 가 끊김으로 오판하지 않는다 (DSN-03)
  step_delay_s: 0.0                   # 기능 함수 사이 대기. 실제 운전은 0.0 (뼈대·정책 시험용)
  records_path: records.csv           # 기록 파일 (실행 위치 기준 상대경로, AGENTS.md 규칙 7)
  use_mock: []                        # 가짜 모듈로 바꿀 기능. 예: [f1, f3] · [f1, f2, f3] 이면 드라이버 없이 돈다.
                                      #   런치 인자 use_mock(= 환경변수 PREWASH_USE_MOCK)이 있으면 그 값이 이 줄을 덮어쓴다
  mock:
    fail_on: []                       # 실패 주입. 예: ["place:SEAT_FAIL", "rack_place:RACK_JAM"]
  preflight:                          # 🆕 9/22 (민범진 · TS-07) — **움직이기 전에** 컨트롤러의 툴·TCP 이름을 확인한다. 다르면 시작 거부
                                      #   9/22 11:22 다른 팀원이 펜던트에서 TCP 를 풀어 둔 채 → 같은 좌표가 208 mm 아래로 → 그릇 바닥 충돌
                                      #   이름의 정본은 cell.yaml 머리말(ENV-05 · 황인재). 바뀌면 여기도 같이 — 비우면 그 항목은 검사 안 함
    tool_name: "Tool Weight"
    tcp_name: "GripperDA_v1"
    timeout_s: 3.0                    # 조회 응답 상한(s)
    cable:                            # 🆕 9/22 🔗 시작 전 케이블 장력 확인 — HOME 에서 정지한 채 Fz 를 samples 회(gap_s 간격) 읽어 흔들림(10~90 % 폭 · g)이
      samples: 8                      #   max_spread_g 를 넘으면 경고(멈추지 않음). 약 5 s · 시작할 때 한 번. samples: 0 이면 끈다
      gap_s: 0.7
      max_spread_g: 60                # 🟡 임시 — HOME 은 저울 자세보다 흔들림이 크다(황인재 §4: HOME 39 g · z158 25 g). 저녁 실기 값으로 조정

hmi:                                  # ── hmi 절 (황인재) ──
  host: 127.0.0.1                     # 접속을 받는 주소. 127.0.0.1 = **이 PC 에서만**(기본) / 0.0.0.0 = 같은 망의 태블릿·노트북에서도
                                      #   🚨 0.0.0.0 으로 열면 같은 와이파이의 누구나 시작·중단 버튼을 누를 수 있다 → 태블릿을 쓸 때만, 끝나면 되돌린다
                                      #   (버튼 확인 값 등은 황인재 결정 사항 — 정해지기 전에는 기본을 바꾸지 않는다, 9/20 PR #39 검토)
  port: 8000                          # HMI 웹 포트
  venv_dir: ~/venvs/hmi               # 웹 서버 부품(fastapi·uvicorn·websockets)을 설치한 HMI 전용 상자 — hmi_bridge 가 여기서 찾아 붙인다(F4-01)
  state_rate_hz: 2                    # 화면 갱신 주기
  disconnect_after_s: 2.0             # /flow/state 가 이 시간 넘게 없으면 "연결 끊김"
  service_timeout_s: 1.0              # 버튼(/flow/start 등)을 누른 뒤 flow 의 대답을 기다리는 상한 — 넘으면 "flow 응답 없음" (F4-02)
  db_path: prewash.db                 # SQLite 파일 (실행 위치 기준 상대경로)
