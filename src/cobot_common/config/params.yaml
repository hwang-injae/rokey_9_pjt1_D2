# params.yaml — 기능별 절. 🚨 **자기 절만 고친다.** (SDD §4.3, IRD §9)
#
# INF-04(9/19): 절마다 키 골격을 만들었다. 값은 **초안**이다 — 절 주인이 검증 결과로 바꾸고, 값 옆 주석에 단위·범위·바꾼 이유(날짜)를 적는다.
#   - 여러 기능이 같이 쓰는 값(좌표·속도·힘 상한·프리셋)은 여기 두지 않는다 → cell.yaml (한석형).
#   - **키 이름**을 추가·변경하면 팀 채널에 알린다. **값**은 주인 재량(커밋 본문에 이유).
#   - 코드에서는  cc.cfg()['f3']['wipe_bowl']['target_force_n']  처럼 읽는다. 숫자를 코드에 쓰지 않는다.

f1:                                   # ── f1 절 (한석형) ── 값은 SDD §4.3 예시, 한석형이 확정
  insert_approach_mm: 30              # 팔레트 삽입 전 접근 거리, V-06·F1-04 에서 확정
  tool_return_contact_n: 8            # 툴 반납 때 홀더 바닥 접촉 판정 힘, V-08·F1-03 에서 확정

f2:                                   # ── f2 절 (민범진) ── 값은 SDD §4.3 예시, 민범진이 확정
  empty_weight_g:                     # 빈 용기 기준값 — 판정은 (측정값 − 기준값)
                                      # 🚨 저울로 잰 '진짜 무게' 가 아니라 **로봇이 읽은 값**이다.
                                      #    로봇 하중에는 정체불명 옵셋이 있다(V-02: +42~45 g, 원인 미확정).
                                      #    같은 경로·같은 자세로 재야 판정식에서 상쇄된다.
                                      #    저울 값을 넣으면 빈 용기가 잔반 43 g 으로 보인다.
                                      # 재측정: soc && python3 src/f2_sense_flow/test/rig_f2.py empty --kind BOWL
                                      #    브링업을 다시 했으면(다른 세션) 값이 달라질 수 있다 → 시연 날 아침에 다시
    BOWL: 180                         # 🟡 임시(SDD 예시값) — 아직 실측 전
    CUP: 120                          # 🟡 임시(SDD 예시값) — 아직 실측 전
  leftover_threshold_g: 50            # 잔반 판정 임계 (SR-05). V-02 정밀도 미달이면 100 (SDD §9.9)
  weigh_samples: 5                    # weigh() 평균 횟수
  weigh_settle_s: 0.5                 # 재기 전 정지 대기 — 하중은 흔들리면 튄다 (SDD §5.3)
  weigh_reset_timeout_s: 3.0          # 0점 재설정 응답 상한. 넘으면 포기하고 계속 (TS-03)
  shake:
    WASTE: {amp_deg: 15, cycles: 4, period_s: 0.6}    # 잔반 털기, V-07 에서 조정
    RINSE: {amp_deg: 10, cycles: 3, period_s: 0.5}    # 물 털기
  dip:
    RINSE: {depth_mm: 60, hold_s: 1.0}                # 헹굼 담금

f3:                                   # ── f3 절 (박진용) ── 값의 주인은 박진용. 초안 출처: docs/test_logs/20260918_CELL-02a_용기치수측정.md §4 (SDD §4.3 예시와 다름)
                                      # 🔸 툴 파지 기준(9/20 확정): 그리퍼 끝을 **세척부 윗면에 닿게** 잡는다
                                      #    → 그리퍼 끝 ~ 툴 끝 거리 = 세척부 높이(tool.clean_h_mm).
                                      #    하강 거리·삽입 깊이·닦는 반경을 이 값으로 계산한다(길이를 코드에 적지 않는다).
  soap:
    depth_mm: 40                      # 담금 깊이, F3-03 에서 확정
    hold_s: 0.5                       # 담금 유지, F3-03 에서 확정
  wipe_bowl:
    tool:                             # 그릇용 수세미 (세척부) — 파지 기준은 위 주석
      clean_h_mm: 45                  # 높이 = 그릇 내부 높이 45 와 같다 → 바닥에 닿으면 윗면이 그릇 입구와 나란(그리퍼-테두리 간섭 주의)
      d_mm: 90                        # 지름 (CELL-02a 실측)
    target_force_n: 4.0               # 3~5 N (FR-08), V-03·F3-02 에서 조정
    limit_n: 10.0                     # NFR-01 닦기 10 N
    radius_mm: [2, 9]                 # 🟡 옛 방식(가운데 작은 원) 값 — F3-02 에서 아래 벽 찾기 방식 값으로 교체한다
                                      #    V-03 확정 방식: 그릇 크기를 모른 채 나선으로 넓혀 가다 벽을 만나면 반대로 2바퀴.
                                      #    최대 반경 = (받을 수 있는 가장 큰 그릇 반지름) − wipe_bowl.tool.d_mm / 2
    turns: 4                          # F3-02 에서 확정
    duration_s: 15                    # 타임아웃, F3-02 에서 확정
  wipe_cup:
    tool:                             # 컵용 솔 (세척부)
      clean_h_mm: 95                  # 길이 = 컵 내부 높이 95 (9/19 그리퍼 끝 ~ 솔 끝 실측 95 와 일치)
      d_mm: 55                        # 끝 지름 실측 Ø50~60 의 가운데
    insert_depth_mm: 90               # 초안. 세척부 95 mm 전체 삽입 가능, 바닥 접촉 전 힘 상한과 세척 범위를 V-10에서 확정
    rot_deg: 180                      # 회전각 (SR-09 ±180°), F3-03 에서 확정
    cycles: 4                         # F3-03 에서 확정
    stroke_mm: 30                     # F3-03 에서 확정
    limit_n: 10.0                     # NFR-01 닦기 10 N (회전·스트로크 구간)

flow:                                 # ── flow 절 (민범진) ── 🟡 계획·정책은 DSN-03 에서 확정
  plan:                               # 구역 계획: 위에서부터 차례로, 구역마다 count 개 또는 EMPTY_ZONE 까지
    - {zone: RET_B, kind: BOWL, count: 2}
    - {zone: RET_C, kind: CUP, count: 2}
  rack_order:                         # 칸 배정 순서
    BOWL: [RACK_B1, RACK_B2]
    CUP: [RACK_C1, RACK_C2, RACK_C3, RACK_C4]
  policy:                             # 실패 정책 (IRD §8): next_zone · isolate · retry:N->isolate · pause
    EMPTY_ZONE: next_zone
    LEFTOVER_REMAIN: isolate
    SEAT_FAIL: isolate
    FORCE_LIMIT: "retry:1->isolate"
    TIMEOUT: "retry:1->isolate"
    RACK_JAM: "retry:1->isolate"
    TOOL_FAIL: "retry:1->isolate"
    RACK_FULL: pause
    ROBOT_ERROR: pause
  consumables: {sponge_max_uses: 20, soap_max_dips: 60}
  leftover_max_rounds: 2              # f2.leftover_loop(kind, N) 의 N — 털고 다시 재는 최대 횟수
                                      #   flow 가 넘기는 인자라 flow 절에 둔다 (DSN-03 B8 PM 제안)
  counts:                             # 용기 1개를 처리할 때 기능 함수에 넘기는 횟수 (IRD §8 호출 순서)
    soap_dips: 3                      # f3.soap(count) — 세제 담금
    rinse_dips: 1                     # f2.dip('RINSE', count) — 헹굼 담금
    rinse_shakes: 3                   # f2.shake('RINSE', count) — 물 털기
                                      #   🔔 f2.shake('WASTE', …) 의 횟수는 leftover_loop 안에서
                                      #      f2 절의 shake.WASTE.cycles 를 쓴다(여기 아님)
  done_hold_s: 1.0                    # plan 완료 뒤 step='DONE' 을 유지하는 시간.
                                      #   state_pub_hz 주기보다 길어야 HMI 가 완료를 본다
  state_pub_hz: 2.0                   # /flow/state 발행 주기 (IRD §6 = 2 Hz)
                                      #   🔔 hmi.state_rate_hz(화면 갱신)와 **다른 값**이라 이름을 구분했다.
                                      #   hmi.disconnect_after_s 보다 촘촘해야 HMI 가 끊김으로 오판하지 않는다 (DSN-03)
  step_delay_s: 0.0                   # 기능 함수 사이 대기. 실제 운전은 0.0 (뼈대·정책 시험용)
  records_path: records.csv           # 기록 파일 (실행 위치 기준 상대경로, AGENTS.md 규칙 7)
  use_mock: []                        # 가짜 모듈로 바꿀 기능. 예: [f1, f3] · [f1, f2, f3] 이면 드라이버 없이 돈다.
                                      #   런치 인자 use_mock(= 환경변수 PREWASH_USE_MOCK)이 있으면 그 값이 이 줄을 덮어쓴다
  mock:
    fail_on: []                       # 실패 주입. 예: ["place:SEAT_FAIL", "rack_place:RACK_JAM"]

hmi:                                  # ── hmi 절 (황인재) ──
  port: 8000                          # HMI 웹 포트
  state_rate_hz: 2                    # 화면 갱신 주기
  disconnect_after_s: 2.0             # /flow/state 가 이 시간 넘게 없으면 "연결 끊김"
  db_path: prewash.db                 # SQLite 파일 (실행 위치 기준 상대경로)
