# params.yaml — 기능별 절. 🚨 **자기 절만 고친다.** (SDD §4.3, IRD §9)
#
# INF-04(9/19): 절마다 키 골격을 만들었다. 값은 **초안**이다 — 절 주인이 검증 결과로 바꾸고, 값 옆 주석에 단위·범위·바꾼 이유(날짜)를 적는다.
#   - 여러 기능이 같이 쓰는 값(좌표·속도·힘 상한·프리셋)은 여기 두지 않는다 → cell.yaml (한석형).
#   - **키 이름**을 추가·변경하면 팀 채널에 알린다. **값**은 주인 재량(커밋 본문에 이유).
#   - 코드에서는  cc.cfg()['f3']['wipe_bowl']['target_force_n']  처럼 읽는다. 숫자를 코드에 쓰지 않는다.

f1:                                   # ── f1 절 (한석형) ── 값은 SDD §4.3 예시, 한석형이 확정
  insert_approach_mm: 30              # 팔레트 삽입 전 접근 거리, V-06·F1-04 에서 확정
  tool_return_contact_n: 8            # 툴 반납 때 홀더 바닥 접촉 판정 힘, V-08·F1-03 에서 확정

f2:                                   # ── f2 절 (민범진) ── 값은 SDD §4.3 예시, 민범진이 확정
  empty_weight_g:                     # 빈 용기 기준 무게 — 판정은 (측정값 − 기준값). 실측으로 바꾼다 (V-02·F2-01)
    BOWL: 180
    CUP: 120
  leftover_threshold_g: 50            # 잔반 판정 임계 (SR-05). V-02 정밀도 미달이면 100 (SDD §9.9)
  weigh_samples: 5                    # weigh() 평균 횟수
  shake:
    WASTE: {amp_deg: 15, cycles: 4, period_s: 0.6}    # 잔반 털기, V-07 에서 조정
    RINSE: {amp_deg: 10, cycles: 3, period_s: 0.5}    # 물 털기
  dip:
    RINSE: {depth_mm: 60, hold_s: 1.0}                # 헹굼 담금

f3:                                   # ── f3 절 (박진용) ── 값의 주인은 박진용. 초안 출처: docs/test_logs/20260918_CELL-02a_용기치수측정.md §4 (SDD §4.3 예시와 다름)
  soap:
    depth_mm: 40                      # 담금 깊이, F3-03 에서 확정
    hold_s: 0.5                       # 담금 유지, F3-03 에서 확정
  wipe_bowl:
    target_force_n: 4.0               # 3~5 N (FR-08), V-03·F3-02 에서 조정
    limit_n: 10.0                     # NFR-01 닦기 10 N
    radius_mm: [2, 9]                 # 수세미 Ø90 / 그릇 내경 Ø110 → 중심 이동 한계 10 mm (CELL-02a §2)
    turns: 4                          # F3-02 에서 확정
    duration_s: 15                    # 타임아웃, F3-02 에서 확정
  wipe_cup:
    insert_depth_mm: 90               # 최대 삽입 깊이 < 95 (그리퍼-컵 윗면 여유), V-10 에서 확정
    rot_deg: 180                      # 회전각 (SR-09 ±180°), F3-03 에서 확정
    cycles: 4                         # F3-03 에서 확정
    stroke_mm: 30                     # F3-03 에서 확정
    limit_n: 10.0                     # NFR-01 닦기 10 N (회전·스트로크 구간)

flow:                                 # ── flow 절 (민범진) ── 🟡 계획·정책은 DSN-03 에서 확정
  plan:                               # 구역 계획: 위에서부터 차례로, 구역마다 count 개 또는 EMPTY_ZONE 까지
    - {zone: RET_B, kind: BOWL, count: 2}
    - {zone: RET_C, kind: CUP, count: 2}
  rack_order:                         # 칸 배정 순서
    BOWL: [RACK_B1, RACK_B2]
    CUP: [RACK_C1, RACK_C2, RACK_C3, RACK_C4]
  policy:                             # 실패 정책 (IRD §8): next_zone · isolate · retry:N->isolate · pause
    EMPTY_ZONE: next_zone
    LEFTOVER_REMAIN: isolate
    SEAT_FAIL: isolate
    FORCE_LIMIT: "retry:1->isolate"
    TIMEOUT: "retry:1->isolate"
    RACK_JAM: "retry:1->isolate"
    TOOL_FAIL: "retry:1->isolate"
    RACK_FULL: pause
    ROBOT_ERROR: pause
  consumables: {sponge_max_uses: 20, soap_max_dips: 60}
  use_mock: []                        # 가짜 모듈로 바꿀 기능. 예: [f1, f3] · [f1, f2, f3] 이면 드라이버 없이 돈다.
                                      #   런치 인자 use_mock(= 환경변수 PREWASH_USE_MOCK)이 있으면 그 값이 이 줄을 덮어쓴다
  mock:
    fail_on: []                       # 실패 주입. 예: ["place:SEAT_FAIL", "rack_place:RACK_JAM"]

hmi:                                  # ── hmi 절 (황인재) ──
  port: 8000                          # HMI 웹 포트
  state_rate_hz: 2                    # 화면 갱신 주기
  disconnect_after_s: 2.0             # /flow/state 가 이 시간 넘게 없으면 "연결 끊김"
  db_path: prewash.db                 # SQLite 파일 (실행 위치 기준 상대경로)
