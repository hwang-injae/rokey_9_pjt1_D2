# cell.yaml — 여러 기능이 같이 쓰는 값(좌표·속도·힘 상한·프리셋). 🚨 주인 한석형 혼자 고친다. 나머지는 읽기만. (SDD §4.3, IRD §9)
#
# INF-04(9/19): **키 골격만** 만들었다. 값은 전부 비어 있다(= null) → 한석형이 티칭(CELL-04·04b)·검증 결과로 채운다.
#   - 비어 있는 값은 `cobot_common.config.unfilled(cfg)` 로 목록을 볼 수 있고, init() 이 개수를 경고로 알려 준다.
#   - 키 이름 규칙: 소문자 snake_case + 단위 접미사(_mm _deg _n _g _s _pct). ID 는 IRD §2 대문자 그대로.
#   - 좌표는 posj(관절 6개, deg) 또는 posx(x y z rx ry rz, mm·deg — **BASE 기준 절대 자세**) 중 하나를 키 이름으로 밝힌다.
#   - 9/20 CELL-04(결정 E4): **양식을 티칭 데이터에 맞췄다** — 아래 stations 위의 '자세 적는 법' 을 본다.
#   - 값 옆 주석에 단위·허용 범위·바꾼 이유(날짜)를 적는다. 예)  safe_z_mm: 150   # 9/19 V-19 도달 범위 확인
#   - 🟡 표시는 9/19 저녁 DSN-03 에서 방식이 정해진 뒤에 채우는 곳이다.
#
# 🔧 로봇 컨트롤러 쪽 툴 설정 — 이 파일의 값이 아니라 Dart 에서 등록한다 (9/22 ENV-05 황인재 · 기록 docs/test_logs/20260922_ENV-05_툴무게등록_황인재.md)
#   TCP `GripperDA_v1`    : X 0 · Y 0 · Z 208 mm · A 0 · B 0 · C 0   ← 이 파일의 posx 좌표는 전부 이 TCP 기준이다. 🚨 바꾸면 좌표가 전부 틀어진다
#   툴 무게 `Tool Weight` : 1.440 kg · 무게중심 (3.98, −3.21, 2.45) mm  ← 9/22 Dart 자동 측정 2회째(1회째 1.450 kg · (4.65, −4.31, −0.80))
#     그 전(실습 때 값) 1.400 kg · (0.17, 4.85, 10.91) — 무게 판정이 자세마다 60 g 달라(9/21 민범진) 다시 쟀다. 무게 판정 기준값은 이 설정으로 잰다
#   🚨 두 이름을 바꾸지 않는다 — rig_v03·rig_v10(박진용)이 이름으로 확인한다. 브링업 뒤 get_current_tool·get_current_tcp 서비스(`robottool` 별칭)로 두 이름이 나오는지 본다
cell:
  limits:                         # 속도·안전 높이·공통 힘 상한·타임아웃  (SDD §4.3 예시: 60 · 30 · 150 · 10 · 15 · 10)
    vel_free_pct: 60              # 빈손 이동 속도 % (SDD §4.3)
    vel_carry_pct: 30             # 용기·툴을 들고 이동할 때 속도 % (SDD §4.3)
    safe_z_mm: 235                # 접촉 동작 뒤 **후퇴 높이**(cc.safe_retreat 가 여기까지 올린다) — 이동 경로와 무관(9/20 결정 E7: 이동의 안전 높이 경유는 없앴다)
                                  #   🚨 SDD §4.3 예시는 150 이지만 그러면 **컵을 닦던 솔이 컵 밖으로 안 나온다** → 235 로 정했다(황인재 9/21).
                                  #   근거(CELL-02a 치수 + 9/20 실기 E13): 용기 안 바닥 TCP z = 33 · 그릇 내부 높이 45 → 그릇 입구 78 · 컵 내부 높이 95 → 컵 입구 128
                                  #     그리퍼 끝 → 툴 끝 = 수세미 35 · 솔 95  ⇒ 툴 끝이 입구 위로 나오는 TCP = 그릇 78+35 = 113 · **컵 128+95 = 223**
                                  #     223 + 여유 12 = 235. 한석형이 찍은 닦기 접근점(SPONGE_BED_B/C.wash.approach_posx z = 235)과 같은 높이라 서로 맞는다
                                  #   🔎 실기에서 눈으로 확인할 것(V-22·V-25): 솔을 쥔 채 이 높이로 올라오면 컵 밖으로 완전히 나오는가
    contact_limit_n: 2.0          # 🔑 지금은 **닦기 바닥 찾기 전용** — f3_wipe/wipe.py 가 이 값을 직접 읽는다(cc.contact_down 의 limit)
                                  #   2.0 = 9/20 결정 E13(박진용 실기): 시작 힘 대비 2 N 이 커지면 바닥으로 본다
                                  #   🚨 절대값이 아니라 **시작 힘 대비 변화량**이다(공중에서도 툴 무게로 1.4~2.4 N 이 읽힌다)
                                  #   NFR-01 의 "탐색 하강 10 N" 은 쓰는 곳이 없어졌다 — 탐색 파지가 고정 자리 파지로 바뀌었다(9/19 DSN-04 · 9/20 E9)
                                  #   안착 놓기는 beds.*.seat.contact_limit_n(15) · 팔레트 삽입은 insert_limit_n(15) 을 따로 쓴다
    insert_limit_n: 15            # 삽입(팔레트·컵 솔) 힘 상한    — NFR-01 "안착 15 N · 삽입 15 N"
    timeout_s: 10                 # 접촉 동작 공통 타임아웃 (SDD §4.3)

  motion:                         # 이동 함수(motion.py) 공용 값 — INF-02. "100 % 기준 속도": 실제 속도 = 기준 × limits.vel_*_pct/100 × 실행 인자 vel_scale
    vel_tcp_max_mm_s: 400         # 직선 이동(movel) 100 % 기준 속도.  (SDD §4.3)  로봇 사양의 최대가 아니라 **우리 셀에서 허용하는 최대**를 적는다
                                  #   🚨 빈손 60 % = 240 mm/s — 컨트롤러 수동 모드 TCP 상한(≈250 mm/s)에 가깝다.
                                  #      Virtual 에서 300 mm/s 는 잘렸고 275 를 넘으면 이동이 **정지**했다(9/20) → V-22 에서 vel_scale 을 올릴 때 확인한다
    acc_tcp_max_mm_s2: 800        # 직선 이동 100 % 기준 가속도 (SDD §4.3)
    vel_joint_max_deg_s: 100      # 관절 이동(movej) 100 % 기준 속도 (SDD §4.3)
    acc_joint_max_deg_s2: 200     # 관절 이동 100 % 기준 가속도 (SDD §4.3)        (Virtual 시험 값: src/cobot_common/test/config_virtual/cell.yaml)
    move_timeout_s: 30            # 이동 1번의 상한 시간(일시정지한 시간은 빼고). 넘으면 정지 명령을 보내고 오류 — V-24 에서 추가

  force:                          # 힘 함수(force.py) 공용 값 — 이슈 #7 ①. 값은 박진용(V-03 9/20 실기로 확정, 시험 기록 docs/test_logs/20260919_V-03_*)
    compliance_stx: [1000, 1000, 200, 100, 100, 100]   # 순응 강성 [x, y, z, rx, ry, rz] N/m · Nm/rad
                                  #   Z 를 가장 물렁하게(200) — 닿을 때 충격을 흡수. 옆·회전도 낮춰(1000·100) 툴이 바닥을 물고
                                  #   비틀릴 때 붙었다 떨어지며 작업대를 흔드는 것(스틱-슬립)을 줄였다. 강의 범위 X·Y·Z 0~20000, 회전 0~400
    contact_step_mm: 3.0          # contact_down 하강 한 단계 — 순응 중이라 닿아도 한 걸음만큼만 눌린다.
                                  #   0.5 mm 는 너무 느리고, 5 mm 이상은 무른 툴에서 한 번에 깊게 눌린다
    contact_vel_mm_s: 20.0        # 접촉 하강 속도 (× vel_scale 0.3 = 6 mm/s)
    contact_acc_mm_s2: 30.0       # 접촉 하강 가속도 — 걸음마다 급정거하면 작업대가 울린다
    retreat_vel_mm_s: 200.0       # safe_retreat 후퇴 속도 (× 0.3 = 60 mm/s, 내려올 때와 같게)
    retreat_acc_mm_s2: 200.0      # safe_retreat 후퇴 가속도
    force_max_n: 15.0             # 힘 함수 인자의 절대 상한 (닦기 상한 10 N 위, 접촉 동작 어디서도 넘지 않는다)
    search_y_period_ratio: 2.0    # periodic_search 의 x:y 주기 비 — 한 선이 아니라 면을 훑게 (V-04 에서 재확인)

  presets:                        # 종류·툴별 파지. 🟡 그릇은 외경 114 mm > RG2 최대 폭 110 mm 라 지름 방향 파지 불가(CELL-02a §3) → 파지 방식은 DSN-03
                                  # 🔑 grip_zero_mm (9/21 결정 E16 · 민범진 실측): 빈손으로 꽉 닫아도 드라이버가 읽는 폭이 0 이 아니라 **10.5~10.9 mm** 다
                                  #   (알루미늄 손가락 사이를 재서 고무 핑거팁 두께가 안 빠진다). 그래서 그릇의 실제 파지 폭 2 mm 는 드라이버 값으로는 도달 불가능한 수다.
                                  #   ㉠안(황인재 확정): 영점을 **새 키**로 두고 **폭 판정에서만** 빼고 본다 —
                                  #     판정 폭 = cc.grip_width() − grip_zero_mm.  cc.grip_width() 의 반환과 cc.grip() 의 목표 폭은 **드라이버 값 그대로**(기존 코드 안 깨짐).
                                  #   🔄 9/21 정정(V-01 실기 · 민범진): **영점은 파지 힘과 무관하다.** 앞서 "힘에 따라 0.2~0.4 mm"
                                  #     로 본 것은 타임아웃(3 s)에 걸려 **닫는 중간**을 읽은 것이었다. 상한을 8 s 로 늘리니
                                  #     20 N·35 N 모두 10.50 으로 같다 → 영점은 **하나(10.58)** 이고 용기 종류와도 무관하다.
    BOWL:                         # ✅ 9/21 V-01·V-05·V-23 실기로 확정 (민범진) — 10회씩, 낙하 0
      grip_width_mm: 2.15         # 파지 목표 폭 (영점 뺀 값) — 실측 벽 두께 2 mm 와 일치
      grip_zero_mm: 10.58         # 빈손 영점 — 10회 평균(흔들림 0.20)
      grip_force_n: 20            # NORMAL (집기·이송·놓기)
      hold_force_n: 35            # HOLD   (털기·담금·물 털기) — 🟡 "낙하 없는 최소 힘" 은 V-16 에서 더 낮출 수 있다
      width_tol_mm: 0.6           # 폭 판정 허용 오차 — 흔들림 0.30 < tol < 빈손과의 간격/2 (1.00)
      approach_z_mm:              # 접근 높이  ← 🟡 좌표 담당(황인재)
    CUP:                          # 옆면 파지 (9/22 한석형 실기 동선 확정)
                                  # 🚨 9/21 결정 E19 — 컵은 **폭으로 판정하지 않는다**: grip_target_mm 까지만 닫고 멈춘다.
                                  #   이유: 컵이 물러 RG2 최저 힘 5 N 으로도 눈에 보이게 눌린다(20 N 에서는 안전 스위치 작동).
                                  #   알고 감수하는 한계 3가지 —
                                  #     ① 빈손과 구분이 안 된다(컵 77.90 vs 빈손 77.80) → f1.pick 의 폭 판정·EMPTY_ZONE 을 컵에 쓰지 않는다
                                  #     ② HOLD 가 안 먹는다(목표 폭에 이미 있어 '다시 잡기' 가 없다) → 털기·물 털기는 NORMAL 힘으로 버틴다(V-07)
                                  #     ③ 놓친 것은 무게로만 안다(f2 min_net_g −30 g) → 컵 실측 16~21 g 이라 놓침을 못 잡는 한계가 있다
                                  #   9/22 실기 동선 시험 스크립트만 WEIGH/WASTE·RINSE SHAKE를 생략한다. 제품 flow 변경은 별도 결정 사항이다.
                                  # 🔄 9/22 저녁(황인재 · CELL-05): 컵도 **그릇처럼 테두리 벽을 위에서 집는다** → 옆면 고정 폭(E19)을 끄고 폭 판정(E16)으로.
                                  #   grip_target_mm 을 **빼면** 코드가 폭 판정을 쓴다(handling._grip_close · 키로 고른다). 되돌리려면 아래 한 줄을 살린다.
      # grip_target_mm: 76.0      # (E19 옆면 파지 · 9/22 한석형) — 9/22 저녁부터 안 쓴다
      grip_width_mm: 1.7          # ✅ 9/22 실기(황인재 · date 값): 반납 자리 pick 1.82 · 1.92 · 1.92 / 홈 C 재파지 21:24 **1.42** → 가운데 1.7 (허용 1.1~2.3)
                                  #   재파지가 얇게 읽히는 건 홈에 앉은 컵의 벽을 조금 다른 높이에서 무는 탓으로 보임 · 빈손이면 11.08 에서 멈춰 0.5 → 판정 밖(그릇은 2.15)
      grip_zero_mm: 10.58         # 그릇과 같다 (빈손 영점은 용기와 무관)
      grip_force_n: 20            # 벽 집기라 그릇과 같은 NORMAL — 옆면 파지 때의 5 N(눌림) 사정은 벽에는 해당 없음
      hold_force_n: 35            # HOLD — 그릇과 같게(털기·담금) · 🟡 컵 벽이 버티는지 첫 실기
      width_tol_mm: 0.6           # 그릇과 같게 · 첫 실기 흔들림으로 조정
      approach_z_mm:              # 접근 높이  ← 🟡 좌표 담당(황인재)
    SPONGE:                       # ✅ 9/22 18:08 V-08 실기(황인재 · rig_tool_width --at-holder): TOOL_SPONGE.pick 에서 5회 쥐어 읽은 폭 25.10 (25.10~25.30 · 폭 0.20)
                                  #   손잡이가 단단해 폭 판정(E16)이 된다: 명령 = 영점 + 14.52 − 2×0.6 = 23.9 → 빈손이면 23.9 에서 멈춰 영점 뺀 13.3 → |13.3−14.52| = 1.2 > 0.6 → TOOL_FAIL
                                  #   (9/21 박진용 관찰 "손잡이에서 25.6 mm" 와 일치 · 한석형 스크립트 30 mm 목표는 손잡이에 걸려 25 에서 멈추던 값)
      grip_width_mm: 15.0         # 영점 뺀 폭. ✅ 9/22 18:22 V-08 2단계 tool(PICK) 실기 10/10: 읽은 폭 **25.60**(흔들림 0.00) − 영점 10.58 = 15.02
                                  #   (영점까지 닫는 손 측정은 25.10 이었는데 tool() 은 목표 23.9 로 닫다 손잡이에서 멈춰 25.60 — 실제 경로 값을 쓴다)
      grip_zero_mm: 10.58         # 빈손 영점 — 그리퍼 것이라 BOWL 과 같다(9/21 민범진 10회 평균)
      grip_force_n: 40            # 한석형 스크립트·박진용 #72 와 같은 힘 (닦기 중 미끄러지지 않게)
      width_tol_mm: 0.6           # 5회 흔들림 0.20 의 3배 · 빈손과의 간격 1.2 의 절반
    BRUSH:                        # ✅ 9/22 18:09 V-08 실기(황인재 · rig_tool_width --at-holder): TOOL_BRUSH.pick 에서 5회 읽은 폭 19.30 (19.30~19.40 · 폭 0.10)
                                  #   폭 판정(E16): 명령 = 영점 + 8.72 − 2×0.6 = 18.1 → 빈손이면 18.1 에서 멈춰 영점 뺀 7.5 → |7.5−8.72| = 1.2 > 0.6 → TOOL_FAIL
                                  #   (SDD 초안 22 mm 는 손잡이에 걸려 19.3 에서 멈추던 값 · 회차 사이 release 직후 grip 이 한 번 안 움직였다 — 값은 같음)
      grip_width_mm: 8.3          # 영점 뺀 폭. 🔄 9/22 18:27 V-08 2단계 tool(PICK) 실기 10회: 읽은 폭 19.10 → 18.9 → 18.8×5 → 18.6 → 18.8 → 18.6 (평균 18.85 · 폭 0.5)
                                  #   손 측정 19.30(영점까지 닫음) 기준 8.72 로 두니 18.60(8.02)이 하한 8.12 아래로 떨어져 8·10회차 TOOL_FAIL(8/10 · 기준 미달)
                                  #   → 실제 경로 평균 18.85 − 10.58 = 8.27 ≈ 8.3 을 가운데로. 허용 범위 7.7~8.9(드라이버 18.3~19.5)가 실측 18.6~19.1 을 덮는다
                                  #   반납 때 홀더 바닥을 찾아 놓으므로 회차마다 솔이 조금씩 다르게 앉는다(손잡이가 가늘어져 폭이 0.5 흔들림) — 2차 CYCLE 로 재확인
      grip_zero_mm: 10.58         # 빈손 영점 — 그리퍼 것이라 BOWL 과 같다
      grip_force_n: 30            # 한석형 스크립트(SDD 초안)와 같은 힘 — 솔 손잡이가 수세미보다 가늘어 40 은 쓰지 않았다
      width_tol_mm: 0.6           # 5회 흔들림 0.10 · 빈손과의 간격 1.2 의 절반

  # ───────────────────────────────────────────────────────────── 자세 적는 법 (9/20 CELL-04 · 결정 E4)
  # 값의 출처: 한석형 티칭 — 브랜치 seokhyung/20260919-CELL-04-teaching 의 rig_f1.py(5ac87e4) 상수 26개를 **고치지 않고** 옮겼다(옮긴 사람 황인재).
  #   🔴 = 아직 안 찍은 자세(한석형이 추가 티칭) · ⚠ = 찍은 값에 확인할 점이 있다 · 옆의 (…) = 한석형 스크립트에서의 이름
  #
  # 자세 1개 = {posj: [...]}  또는  {posx: [...]}  또는  {approach_posx: [...], posx: [...]}
  #   approach_posx = **접근점**(끝점 바로 위 — 옆으로 움직여도 되는 높이),  posx = **끝점**(놓는·잡는·닿는 자리)
