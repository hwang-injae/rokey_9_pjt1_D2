# cell.yaml — 여러 기능이 같이 쓰는 값(좌표·속도·힘 상한·프리셋). 🚨 주인 한석형 혼자 고친다. 나머지는 읽기만. (SDD §4.3, IRD §9)
#
# INF-04(9/19): **키 골격만** 만들었다. 값은 전부 비어 있다(= null) → 한석형이 티칭(CELL-04·04b)·검증 결과로 채운다.
#   - 비어 있는 값은 `cobot_common.config.unfilled(cfg)` 로 목록을 볼 수 있고, init() 이 개수를 경고로 알려 준다.
#   - 키 이름 규칙: 소문자 snake_case + 단위 접미사(_mm _deg _n _g _s _pct). ID 는 IRD §2 대문자 그대로.
#   - 좌표는 posj(관절 6개, deg) 또는 posx(x y z rx ry rz, mm·deg — **BASE 기준 절대 자세**) 중 하나를 키 이름으로 밝힌다.
#   - 9/20 CELL-04(결정 E4): **양식을 티칭 데이터에 맞췄다** — 아래 stations 위의 '자세 적는 법' 을 본다.
#   - 값 옆 주석에 단위·허용 범위·바꾼 이유(날짜)를 적는다. 예)  safe_z_mm: 150   # 9/19 V-19 도달 범위 확인
#   - 🟡 표시는 9/19 저녁 DSN-03 에서 방식이 정해진 뒤에 채우는 곳이다.
cell:
  limits:                         # 속도·안전 높이·공통 힘 상한·타임아웃  (SDD §4.3 예시: 60 · 30 · 150 · 10 · 15 · 10)
    vel_free_pct: 60              # 빈손 이동 속도 % (SDD §4.3)
    vel_carry_pct: 30             # 용기·툴을 들고 이동할 때 속도 % (SDD §4.3)
    safe_z_mm: 235                # 접촉 동작 뒤 **후퇴 높이**(cc.safe_retreat 가 여기까지 올린다) — 이동 경로와 무관(9/20 결정 E7: 이동의 안전 높이 경유는 없앴다)
                                  #   🚨 SDD §4.3 예시는 150 이지만 그러면 **컵을 닦던 솔이 컵 밖으로 안 나온다** → 235 로 정했다(황인재 9/21).
                                  #   근거(CELL-02a 치수 + 9/20 실기 E13): 용기 안 바닥 TCP z = 33 · 그릇 내부 높이 45 → 그릇 입구 78 · 컵 내부 높이 95 → 컵 입구 128
                                  #     그리퍼 끝 → 툴 끝 = 수세미 35 · 솔 95  ⇒ 툴 끝이 입구 위로 나오는 TCP = 그릇 78+35 = 113 · **컵 128+95 = 223**
                                  #     223 + 여유 12 = 235. 한석형이 찍은 닦기 접근점(SPONGE_BED_B/C.wash.approach_posx z = 235)과 같은 높이라 서로 맞는다
                                  #   🔎 실기에서 눈으로 확인할 것(V-22·V-25): 솔을 쥔 채 이 높이로 올라오면 컵 밖으로 완전히 나오는가
    contact_limit_n: 2.0          # 🔑 지금은 **닦기 바닥 찾기 전용** — f3_wipe/wipe.py 가 이 값을 직접 읽는다(cc.contact_down 의 limit)
                                  #   2.0 = 9/20 결정 E13(박진용 실기): 시작 힘 대비 2 N 이 커지면 바닥으로 본다
                                  #   🚨 절대값이 아니라 **시작 힘 대비 변화량**이다(공중에서도 툴 무게로 1.4~2.4 N 이 읽힌다)
                                  #   NFR-01 의 "탐색 하강 10 N" 은 쓰는 곳이 없어졌다 — 탐색 파지가 고정 자리 파지로 바뀌었다(9/19 DSN-04 · 9/20 E9)
                                  #   안착 놓기는 beds.*.seat.contact_limit_n(15) · 팔레트 삽입은 insert_limit_n(15) 을 따로 쓴다
    insert_limit_n: 15            # 삽입(팔레트·컵 솔) 힘 상한    — NFR-01 "안착 15 N · 삽입 15 N"
    timeout_s: 10                 # 접촉 동작 공통 타임아웃 (SDD §4.3)

  motion:                         # 이동 함수(motion.py) 공용 값 — INF-02. "100 % 기준 속도": 실제 속도 = 기준 × limits.vel_*_pct/100 × 실행 인자 vel_scale
    vel_tcp_max_mm_s: 400         # 직선 이동(movel) 100 % 기준 속도.  (SDD §4.3)  로봇 사양의 최대가 아니라 **우리 셀에서 허용하는 최대**를 적는다
                                  #   🚨 빈손 60 % = 240 mm/s — 컨트롤러 수동 모드 TCP 상한(≈250 mm/s)에 가깝다.
                                  #      Virtual 에서 300 mm/s 는 잘렸고 275 를 넘으면 이동이 **정지**했다(9/20) → V-22 에서 vel_scale 을 올릴 때 확인한다
    acc_tcp_max_mm_s2: 800        # 직선 이동 100 % 기준 가속도 (SDD §4.3)
    vel_joint_max_deg_s: 100      # 관절 이동(movej) 100 % 기준 속도 (SDD §4.3)
    acc_joint_max_deg_s2: 200     # 관절 이동 100 % 기준 가속도 (SDD §4.3)        (Virtual 시험 값: src/cobot_common/test/config_virtual/cell.yaml)
    move_timeout_s: 30            # 이동 1번의 상한 시간(일시정지한 시간은 빼고). 넘으면 정지 명령을 보내고 오류 — V-24 에서 추가

  force:                          # 힘 함수(force.py) 공용 값 — 이슈 #7 ①. 값은 박진용(V-03 9/20 실기로 확정, 시험 기록 docs/test_logs/20260919_V-03_*)
    compliance_stx: [1000, 1000, 200, 100, 100, 100]   # 순응 강성 [x, y, z, rx, ry, rz] N/m · Nm/rad
                                  #   Z 를 가장 물렁하게(200) — 닿을 때 충격을 흡수. 옆·회전도 낮춰(1000·100) 툴이 바닥을 물고
                                  #   비틀릴 때 붙었다 떨어지며 작업대를 흔드는 것(스틱-슬립)을 줄였다. 강의 범위 X·Y·Z 0~20000, 회전 0~400
    contact_step_mm: 3.0          # contact_down 하강 한 단계 — 순응 중이라 닿아도 한 걸음만큼만 눌린다.
                                  #   0.5 mm 는 너무 느리고, 5 mm 이상은 무른 툴에서 한 번에 깊게 눌린다
    contact_vel_mm_s: 20.0        # 접촉 하강 속도 (× vel_scale 0.3 = 6 mm/s)
    contact_acc_mm_s2: 30.0       # 접촉 하강 가속도 — 걸음마다 급정거하면 작업대가 울린다
    retreat_vel_mm_s: 200.0       # safe_retreat 후퇴 속도 (× 0.3 = 60 mm/s, 내려올 때와 같게)
    retreat_acc_mm_s2: 200.0      # safe_retreat 후퇴 가속도
    force_max_n: 15.0             # 힘 함수 인자의 절대 상한 (닦기 상한 10 N 위, 접촉 동작 어디서도 넘지 않는다)
    search_y_period_ratio: 2.0    # periodic_search 의 x:y 주기 비 — 한 선이 아니라 면을 훑게 (V-04 에서 재확인)

  presets:                        # 종류·툴별 파지. 🟡 그릇은 외경 114 mm > RG2 최대 폭 110 mm 라 지름 방향 파지 불가(CELL-02a §3) → 파지 방식은 DSN-03
    BOWL:
      grip_width_mm:              # 파지 목표 폭
      grip_force_n:               # NORMAL (집기·이송·놓기)
      hold_force_n:               # HOLD   (털기·담금·물 털기) — V-16·V-23
      width_tol_mm:               # 폭 판정 허용 오차 — V-01
      approach_z_mm:              # 접근 높이
    CUP:                          # 옆면 파지 (9/18 V-17 확인)
      grip_width_mm:
      grip_force_n:
      hold_force_n:
      width_tol_mm:
      approach_z_mm:
    SPONGE:
      grip_width_mm:
      grip_force_n:
      width_tol_mm:
    BRUSH:
      grip_width_mm:
      grip_force_n:
      width_tol_mm:

  # ───────────────────────────────────────────────────────────── 자세 적는 법 (9/20 CELL-04 · 결정 E4)
  # 값의 출처: 한석형 티칭 — 브랜치 seokhyung/20260919-CELL-04-teaching 의 rig_f1.py(5ac87e4) 상수 26개를 **고치지 않고** 옮겼다(옮긴 사람 황인재).
  #   🔴 = 아직 안 찍은 자세(한석형이 추가 티칭) · ⚠ = 찍은 값에 확인할 점이 있다 · 옆의 (…) = 한석형 스크립트에서의 이름
  #
  # 자세 1개 = {posj: [...]}  또는  {posx: [...]}  또는  {approach_posx: [...], posx: [...]}
  #   approach_posx = **접근점**(끝점 바로 위 — 옆으로 움직여도 되는 높이),  posx = **끝점**(놓는·잡는·닿는 자리)
  # 한 자리에 자세가 여러 개면 이름을 붙여 나눈다:
  #   종류별  WASTE: {BOWL: {...}, CUP: {...}}          → cc.move_to('WASTE', True, 'BOWL')         그릇은 위에서·컵은 옆에서 잡아 자세가 다르다
  #   용도별  TOOL_SPONGE: {pick: {...}, return: {...}} → cc.move_to('TOOL_SPONGE', False, point='pick')
  #   슬롯별  RET_B: {slots: [{...}]}                   → cc.move_to('RET_B', False, point=1)       슬롯 번호는 1 부터 (9/20 E9: 구역마다 1개)
  # cc.move_to 는 티칭한 자세로 **곧장** 간다(9/20 결정 E7 — 안전 높이를 거치지 않는다). 접근점이 있으면 **접근점까지만** 가고
  #   끝점까지 남은 높이(mm)를 돌려준다(접근점이 없으면 끝점까지 가고 0). 내려가는 것은 부르는 쪽이 cc.move_rel(0, 0, -남은높이, 'BASE') 나 cc.contact_down 으로.
  #   🚨 경로의 안전은 **자세를 부르는 순서와 티칭**이 책임진다 — 옆으로 가면 부딪히는 자리에는 접근점을 찍는다.
  #   → 접근점과 끝점은 **수직(같은 x·y·방향)** 이어야 곧게 내려간 자리가 끝점이 된다(test_config.py 가 검사한다).
  # 참고(한석형 스크립트가 쓴 속도 — 위 motion 절과 뜻이 다르다, 옮기지 않았다): 관절 20 deg/s·40 deg/s² / 직선 60 mm/s·120 mm/s²
  stations:                       # 작업대 위 고정 위치 (IRD §2 station). 스펀지 홈은 아래 beds
    HOME: {posj: [0.0, 0.0, 90.0, 0.0, 90.0, 0.0]}                          # 안전 자세 — 모든 이동의 시작·끝 (HOME_J)
    WEIGH:                        # 무게 측정 자세 = **집는 자세에서 Z +100**(한석형 9/20 17:10 — 새로 찍지 않고 계산). 빈 용기 기준값도 같은 자세에서 잰다
      BOWL: {posx: [531.78, 8.0, 158.1, 102.0, 180.0, 102.0]}               # ⚠ 쥔 용기가 공급 구조·뒤 용기에 닿지 않는지 실기 확인(닿으면 무게가 틀린다)
      CUP:  {posx: [564.9, 189.6, 147.4, 146.92, 180.0, 151.5]}             # ⚠ 컵 집기를 새로 찍으면 이 값도 같이 바뀐다(집는 자세 + 100)
    WASTE:                        # 잔반통 앞 — 털기를 시작하는 자세
      BOWL: {posx: [615.7, -171.0, 241.0, 164.0, 179.0, 164.0]}             # (BOWL_WASTE_READY)
      CUP:  {posx: [114.8, -407.5, 239.4, 85.0, -166.6, -160.6]}            # (CUP_WASTE_READY)
    SOAP:                         # 세제 수조 위 — **툴을 쥔** 자세 🔴 (박진용 F3 soap 이 기다린다). BOWL = 수세미를 쥐고 · CUP = 솔을 쥐고
      BOWL: {posx: }
      CUP:  {posx: }
    RINSE:                        # 헹굼 수조 앞 — 담금을 시작하는 자세
      BOWL: {posx: [205.8, -445.7, -13.6, 123.2, 180.0, 123.0]}             # (BOWL_RINSE_READY) z 가 받침면 아래 — 수조 모형이 그 높이에 있다(황인재 9/20 확인)
      CUP:  {posx: [152.0, -422.7, 144.33, 164.5, -180.0, 72.8]}            # (CUP_RINSE_READY)
    ISOLATE:                      # 격리 구역 🔴 (민범진 FLOW-01·03 이 기다린다)
      BOWL: {posx: }
      CUP:  {posx: }
    TOOL_SPONGE:                  # 수세미 툴 홀더 — 집을 때와 돌려놓을 때 자세가 다르다
      pick:   {posj: [-40.45, 2.5, 111.5, 0.0, 66.06, -220.37]}             # (BOWL_SPONGE_PICK) ⚠ J6 = −220° — 이어지는 직선 이동에서 손목이 크게 풀릴 수 있다, 실기 첫 실행 때 본다
      return: {posx: [273.6, -222.86, 65.24, 128.22, 180.0, -52.0]}         # (BOWL_SPONGE_RETURN)
    TOOL_BRUSH:                   # 솔 홀더
      pick:   {posj: [-28.7, 17.0, 84.0, -0.12, 79.0, -28.7]}               # (CUP_SPONGE_PICK)
      return: {posx: [422.94, -223.0, 130.0, 156.9, 180.0, 156.7]}          # (CUP_SPONGE_RETURN)

  zones:                          # 반납 구역 — **한 자리 공급 구조**(9/20 결정 E9): 내리막이라 하나를 꺼내면 뒤 용기가 같은 자리로 내려온다 → 집는 자리는 구역마다 1개
                                  #   (양식은 목록 그대로 둔다 — 자리가 늘면 줄만 추가. 헛잡음이면 그 자리가 빈 것 = EMPTY_ZONE)
    RET_B:
      slots:
        - approach_posx: [529.0, 8.0, 171.0, 157.0, 180.0, 157.0]           # 슬롯 1 — 잡기1(접근) = posj [0, 23, 68.4, 0, 88.3, 0]   (한석형 9/20 티칭좌표 문서 §2 · PR #36 때의 BOWL_PICK 이 이 자세다)
          posx:          [531.78, 8.0, 58.1, 102.0, 180.0, 102.0]           #          잡기2(실제 그립) = posj [0, 26.5, 81.6, 0, 72, 0] — 여기서 grip
                                                                            #   ⚠ 접근 → 그립이 수평 2.8 mm 어긋난다(방향은 같다). 그릇은 벽을 2 mm 폭으로 잡아서 영향이 있다
                                                                            #     → 그립 자세에서 z 만 올려 접근점을 다시 읽는다(한석형). 그 전에는 곧게 내려가면 2.8 mm 옆에 닿는다
    RET_C:
      slots:
        - {posj: [17.78, 35.8, 68.4, 0.0, 75.84, 22.6]}                     # 슬롯 1 (CUP_PICK) = **실제 그립** 자세(posx [564.9, 189.6, 47.4, 146.92, 180, 151.5]) — 여기서 grip
                                                                            #   🟡 접근 자세가 아직 없다 → 지금은 관절 이동으로 그립 자세에 곧장 들어간다(한석형 스크립트와 같은 경로). 접근점이 오면 붙인다

  beds:                           # 스펀지 홈 — place = 용기를 놓는 자리 · regrip = 닦은 뒤 다시 잡는 자리 · wash = 툴로 닦기 시작하는 자리(F3)
    SPONGE_BED_B:
      place:                                                                # 그릇은 놓은 자리에서 그대로 다시 잡는다 → regrip 도 이 자세
        approach_posx: [419.7, 17.5, 202.1, 128.2, 180.0, -52.0]            # (BOWL_PLACE_1)
        posx:          [419.7, 17.5, 54.4, 128.0, 180.0, -52.2]             # (BOWL_PLACE_2)
      wash:                                                                 # 놓는 자리와 53 mm 떨어져 있다 — 그릇 벽을 잡아서 그리퍼가 한쪽으로 치우친 만큼
        approach_posx: [367.5, 8.0, 235.0, 157.2, 180.0, 157.0]             # (BOWL_WASH_WAIT)
        posx:          [367.5, 8.0, 68.0, 157.2, 180.0, 157.0]              # (BOWL_WASH_CONTACT) 🔑 47.0 → 68 (9/20 결정 E13 · 박진용 실기: 수세미 35 mm 로 바닥에 닿은 TCP Z)
                                                                            #   실제 접촉은 cc.contact_down 이 힘으로 찾는다 — 이 값은 내려가기 시작하는 높이다
      seat:                       # 안착 놓기 파라미터 — V-04 (SDD §4.3 · F1-05 한석형이 V-04 결과로 조정)
        contact_limit_n: 15
        search_amp_mm: 3
        search_period_s: 0.8
        search_max_s: 6
    SPONGE_BED_C:
      place:
        approach_posx: [367.56, 114.2, 300.0, 89.0, 126.2, 86.0]            # (CUP_PLACE_1)
        posx:          [367.56, 114.2, 111.8, 89.0, 126.2, 86.0]            # (CUP_PLACE_2)
      regrip: {posj: [-29.24, 19.3, 132.86, 68.2, 71.8, -63.8]}             # (CUP_REGRIP) 컵은 놓을 때와 다른 방향에서 다시 잡는다
      wash:
        approach_posx: [369.19, 152.77, 235.0, 156.96, 180.0, 156.8]        # (CUP_WASH_WAIT)
        posx:          [369.19, 152.77, 128.0, 156.96, 180.0, 156.8]        # (CUP_WASH_CONTACT) 🔑 156.54 → 128 (9/20 결정 E13 · 계산: 용기 안 바닥 33 + 솔 95)
      seat:                       # (SDD §4.3)
        contact_limit_n: 15
        search_amp_mm: 3
        search_period_s: 0.8
        search_max_s: 6

  rack:                           # 식기세척기용 팔레트 모형 — 그릇 2칸 + 컵 2칸(9/20 결정). 칸마다 절대 자세
    # 한석형 스크립트의 경로(참고): HOME(관절) → HOME 의 x·y 그대로 z 338 로 내려와서 → 접근점 → 끝점 → 놓기
    #   → 그릇: y −25 로 빼고 z +200 / 컵: 접근점으로 되돌아 나오기 → HOME(관절)
