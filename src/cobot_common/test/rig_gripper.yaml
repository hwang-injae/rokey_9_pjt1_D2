# rig_gripper.py 시험 값 — 🚨 팀 설정이 아니다. 명령줄 인자로 덮어쓸 수 있다.
force_n: 20.0                 # V-05·V-01 에서 닫을 때 쓰는 힘 (BOWL NORMAL 시작값)
width_wait_s: 5.0             # 첫 폭 값(/onrobot_joint_states)을 기다리는 시간

v05:                          # 폭 경로 확인 — 빈손, 사람 개입 없음
  targets_mm: [0.0, 1.0, 2.0, 3.0, 5.0]   # 🔑 그릇 벽 파지가 ≈ 2 mm 라 닫힌 쪽이 핵심
  tol_mm: 1.0                 # |읽은 폭 − 목표| 가 이보다 크면 경고 (빈손이라 막는 게 없다)

v23:                          # 파지 힘 전환 — 용기를 쥔 채
  drop_mm: 1.0                # 낙하 기준 — 최초 폭에서 이만큼, 또는 최초의 절반(둘 중 낮은 쪽) 아래로 줄면 놓친 것
  change_limit_mm: 2.0        # 전후 폭 변화 상한 (V-16 완료 기준)

v01:                          # 폭 3상태 구분
  close_mm: 0.0               # 🚨 세 상태 **모두 같은 명령** 으로 닫는다.
                              #    목표를 기대 폭보다 작게 줘야 빈손과 갈린다(SDD §5.2)
                              #    → 빈손 ≈ 0 · 그릇 ≈ 2(벽에 막힘) · 컵 ≈ 70(몸통에 막힘)
  states: [EMPTY, BOWL, CUP]
