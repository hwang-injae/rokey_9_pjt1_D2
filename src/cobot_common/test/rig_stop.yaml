# rig_stop.py 시험 값 — 🚨 Virtual 전용. "이동 도중에 정지·일시정지·재개가 먹는가"(V-24a)
start_posj: [0.0, 0.0, 90.0, 0.0, 90.0, 0.0]     # 시작 자세
target_posj: [90.0, 0.0, 90.0, 0.0, 90.0, 0.0]   # J1 만 90° 돌린다
vel_deg_s: 15                                     # 느리게 → 이동 1번이 약 6~7 s (도중에 끼어들 시간)
acc_deg_s2: 30
press_at_s: 2.0                                   # 이동 시작 뒤 이 시각에 정지/일시정지를 "누른다"
resume_after_s: 2.0                               # 일시정지 뒤 이만큼 있다가 재개를 누른다
stop_mode: 1                                      # DR_QSTOP (bootstrap.shutdown 과 같은 값)
service_timeout_s: 15                             # 응답을 기다리는 상한(이동이 끝난 뒤에야 오는지 보려고 길게)
poll_s: 0.1                                       # T3: check_motion 폴링 간격
still_deg: 0.05                                   # 이보다 덜 움직이면 "서 있다"로 본다
still_for_s: 0.3
reach_tol_deg: 0.5
