# rig_v03.py 시험 값 — V-03 힘제어 중 XY 이동 (솔로 그릇 안쪽 바닥 누르며 문지르기)
# 🟡 approach_down_mm 은 현장 실측(솔 끝 → 그릇 안쪽 바닥 거리 − 30 mm)으로 채운다. 비어 있으면 실기에서 실행 거부.
home_posj: [0.0, 0.0, 90.0, 0.0, 90.0, 0.0]   # HOME (실기 확인: X 367.5 · Y 8.0 · Z 215.0, 그릇 중심이 바로 아래)
expected_tool: Tool Weight           # 컨트롤러에 설정돼 있어야 할 툴 무게 이름 — 다르면 실행 거부 (9/19 2회차: 브링업 재시작 뒤 '' 로 비어 있었음)
expected_tcp: GripperDA_v1           # TCP 이름 — 다르면 실행 거부
air_force_max_n: 3.0              # 공중에서 |Fz| 가 이보다 크면 툴 무게 설정이 틀린 것 → 실행 거부
home_vel_deg_s: 40                # × vel_scale (0.3 → 12°/s) — 9/19 저녁: HOME 이동·복귀 2배
home_acc_deg_s2: 40
approach_down_mm: 75.0            # 9/19 실측: 솔 끝 → 그릇 안쪽 바닥 82 mm − 여유 10 mm (4회차: 75 mm. 그리퍼 끝 → 솔 끝 95 mm, 솔 끝 Ø50~60)
virtual_approach_down_mm: 120.0   # Virtual 흐름 확인용
approach_vel_mm_s: 200.0          # × vel_scale (0.3 → 60 mm/s) — 9/19 저녁: 2배
approach_acc_mm_s2: 200.0
contact_max_depth_mm: 30.0        # 빠른 접근 뒤 천천히 찾는 거리 (여유 10 mm + 20 mm)
contact_limit_n: 3.0              # 이 힘에 닿으면 "바닥 찾음"
press_targets_n: [4.0]            # 제자리 누르기 목표 (9/19 2회차: ABS 모드에서 목표 3·4·5 → 실제 1.6·2.0·2.2 N — 튜닝은 F3-02)
press_hold_s: 3.0
wipe_target_n: 4.0                # 문지르는 동안 목표 힘
limit_n: 10.0                     # 이 힘을 넘으면 즉시 힘 해제 (NFR-01 닦기 10 N)
tol_n: 2.0                        # 통과 기준: 평균이 목표 ±2 N (SR-08)
settle_s: 1.0                     # 힘을 건 뒤 안정될 때까지 기다림 (평가에서 뺌)
sample_s: 0.05                    # 힘 기록 주기
log_dir: logs/v03                 # 힘 로그 CSV (실행 위치 기준 상대경로)
# ── 나선 문지르기 · 벽 찾기 · 벽 따라 돌기 (9/19 방식 확정: 8자 대신) ──
scrub_deg: 18.0                   # 손목 좌우 비틀기 명령 각(±) — 이어 붙이기로 조금 줄어 실제 약 ±14.5°(Virtual)
scrub_step_mm: 15.0               # 나선·원 위 한 걸음 (호 길이) — 걸음마다 손목 한 번 비틀기 (9/19 저녁 1.5배: 10 → 15, 비틀기가 J6 한계라 걸음을 늘림)
scrub_lin_vel_mm_s: 450.0         # × vel_scale (0.3 → 135 mm/s) — 9/19 저녁: 1.5배
scrub_rot_vel_deg_s: 740.0        # × vel_scale (0.3 → 222°/s) — 🚨 M0609 J6 최대 225°/s 라 1.5배 불가, 한계 바로 아래로
scrub_lin_acc_mm_s2: 2250.0       # 가속도는 vel_scale 을 곱하지 않는다 — 짧은 걸음은 가속이 시간을 정한다
scrub_rot_acc_deg_s2: 3750.0
blend_radius_mm: 1.0              # 걸음 이어 붙이기 거리 — 크면 부드럽지만 비틀기가 사라진다(Virtual 실측: 4 mm → 실제 비틀기 ±2°, 1 mm → ±12°, 0 → 걸음마다 멈춤)
spiral_pitch_mm: 15.0             # 한 바퀴에 넓어지는 반지름 (9/19 저녁 1.5배: 10 → 15. 솔 Ø55 보다 충분히 작아 빈틈 없음)
# 🔸 그릇 크기는 정해 두지 않는다 — 힘으로 벽을 찾는다. 아래는 셀이 받을 수 있는 그릇의 **범위**(9/19 결정)
bowl_r_max_mm: 150.0              # 가장 큰 그릇 안쪽 반지름 → 솔 중심 최대 반지름 = 150 − 솔 반지름 + 여유 (여기까지 벽이 없으면 중단)
                                  # 가장 작은 그릇 = 솔과 같은 크기 → 가운데부터 벽일 수 있어 마찰은 제자리에서 배운다(learn_twists)
brush_d_mm: 55.0                  # 솔 끝 지름 (9/19 실측 Ø50~60 의 가운데)
r_max_margin_mm: 5.0              # 최대 반지름 여유
learn_twists: 4                   # 가운데 제자리 비틀기 횟수 — 벽 없을 때 옆 힘 크기를 배운다
wall_margin_n: 2.0                # 배운 옆 힘 최대 + 이 값 넘으면 벽
wall_min_n: 3.0                   # 벽 판정 기준의 최소 (9/19 실기: 움직이며 문지를 때 반지름 방향 마찰 약 2 N)
climb_max_mm: 8.0                 # 솔이 바닥에서 이만큼 넘게 올라가면 벽(벽을 타고 오름) — 안전 판정, 벽 따라가기면 안쪽으로
wall_confirm: 1                   # 연속 이 횟수면 벽 (5회차 뒤 2 → 1: 비스듬히 다가갈 때 더 파고들지 않게. 잘못 잡아도 벽 따라가기가 벽까지 민다)
follow_band_n: 3.0                # 벽 따라가기 목표 = 벽 판정 기준 + 이 값/2 의 반지름 방향 힘
follow_gain_mm_per_n: 0.5         # 목표와의 차이 1 N 당 반지름을 고치는 양
follow_step_mm: 3.0               # 한 걸음에 반지름을 고치는 최대량
circle_turns: 2
circle_reverse: true              # 벽 따라 돌기는 나선과 반대 방향 (같은 방향이면 나선 마지막 바퀴와 겹쳐 안 보임 — 9/19 5회차)
circle_pause_s: 0.5               # 벽 발견 → 벽 따라 돌기 사이에 벽에 닿은 채 멈추는 시간
lateral_max_n: 15.0               # 옆 힘 절대 상한 — 넘으면 즉시 중단 (5회차 뒤 12 → 15: 벽 따라가기가 한 걸음 늦게 고치는 여유)
scrub_timeout_s: 300.0            # 나선·원 각각의 시간 상한
# ── Virtual 전용 가짜 벽 (--fake-wall) — 힘이 없는 Virtual 에서 나선 → 벽 → 2바퀴 흐름·시간 확인. 실기에서는 거부 ──
fake_bowl_inner_d_mm: 110.0       # 가짜 그릇 안지름 (우리 그릇 CELL-02a 실측) → 벽 = (110 − 55) / 2 = 27.5 mm. --fake-bowl-d 로 바꾼다
fake_wall_k_n_per_mm: 3.0         # 벽을 1 mm 밀 때 되미는 힘 (순응 X·Y 강성 3000 N/m 와 같게 — 실제로도 이보다 딱딱할 수 없다)
fake_bowl_offset_mm: [3.0, 0.0]   # 그릇 중심이 HOME 아래에서 어긋난 양 (BASE X·Y) — 벽 따라가기가 보이게
